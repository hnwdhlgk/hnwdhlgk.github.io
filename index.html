<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海南大学兼职公开榜</title>
<style>
:root{--blue:#0d47a1;--blue2:#1565c0;--text:#183b60;--muted:#71859a;--bg:#f4f7fb;--line:#e0e8f0;--green:#137333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background-size:cover;background-attachment:fixed;background-position:center}
.wrap{width:min(1120px,94%);margin:auto}
/* 顶部导航 */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}.topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}.brand .logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}.brand b{font-size:15px}
.topauth button{border:0;background:var(--blue);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;margin-left:6px}.topauth button.ghost{background:#e6ecf3;color:var(--text)}.topauth .who{color:var(--muted);font-size:13px;margin-right:6px}
/* Hero */
.hero{padding:50px 0 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px;line-height:1.15}.hero .sub{color:var(--blue2);font-size:13px;letter-spacing:2px;margin-bottom:14px}.hero p{color:var(--muted);line-height:1.7}.hero .btns{margin-top:18px}.hero .btns button{border:0;padding:12px 22px;border-radius:10px;cursor:pointer;font-size:15px;margin-right:8px}.hero .btns .primary{background:var(--blue);color:#fff}.hero .btns .outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.hero-logo{width:200px;height:200px;border-radius:50%;border:4px solid var(--blue);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto;box-shadow:0 8px 30px #0d47a122}.hero-logo .hu{font-size:48px;font-weight:bold;color:var(--blue)}.hero-logo span{font-size:12px;color:var(--muted);margin-top:4px;text-align:center;padding:0 20px}
/* About */
.about{background:#fff;border-radius:16px;padding:30px;margin:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:30px}.about h2{margin-top:0;color:var(--blue)}.about p{color:var(--muted);line-height:1.8}
/* 通用 section */
.section{margin:30px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section-head h2{margin:0;font-size:22px}.section-head .more{color:var(--blue2);font-size:13px;text-decoration:none;cursor:pointer}
/* 筛选标签 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:.15s}.chip:hover{border-color:var(--blue)}.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}.chip .cnt{font-size:11px;background:#eef2f7;color:var(--muted);border-radius:999px;padding:1px 7px}.chip.active .cnt{background:#ffffff33;color:#fff}
.sub-label{color:var(--muted);font-size:12px;margin:12px 0 6px}
/* 比例条 */
.pie-wrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin:10px 0}.pie{width:170px;height:170px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 8px #0001}.legend{flex:1;min-width:180px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px}.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}.legend-item .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}.legend-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.legend-item .num{color:var(--muted);font-size:11px;flex-shrink:0}
/* 兼职卡片 */
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.job{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;transition:.15s}.job:hover{box-shadow:0 6px 20px #143c6415;transform:translateY(-2px)}.job-img{width:100%;aspect-ratio:4/3;height:auto;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block;background:#eef2f7}.job .cats{margin-bottom:6px}.job .tag{color:var(--blue);background:#eef5ff;border-radius:20px;padding:3px 9px;font-size:12px;margin-right:5px}.job .tag.sub{background:#f0f4ff;color:#3949ab}.job .tag.sub2{background:#f5f0ff;color:#7b1fa2}.job h3{margin:6px 0;font-size:16px}.job .meta{color:var(--muted);font-size:13px}.job .salary{color:var(--blue);font-weight:bold;margin:5px 0}.job .jtags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.job .jtag{background:#eef5ff;color:var(--blue);border-radius:20px;padding:2px 8px;font-size:11px;cursor:pointer}.job .jtag.active{background:var(--blue);color:#fff}.job p{color:#4a6080;font-size:13px;line-height:1.6;margin:6px 0}.job .contact{font-size:13px}.job .contact a{color:var(--blue2);text-decoration:none}.job .views{position:absolute;bottom:10px;right:14px;font-size:12px;color:var(--muted)}.job{position:relative;cursor:pointer}.empty{grid-column:1/-1;background:#fff;padding:40px;text-align:center;color:var(--muted);border-radius:14px}
/* 分类图片卡片 */
.cat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.cat-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;transition:.15s}.cat-card:hover{box-shadow:0 6px 20px #143c6415}.cat-card.active{outline:3px solid #d6e7ff}.cat-card img{width:100%;height:100px;object-fit:cover;display:block}.cat-card .cc-body{padding:12px}.cat-card h3{margin:0 0 4px;font-size:15px}.cat-card p{margin:0;color:var(--muted);font-size:12px}
/* 社交 */
.social{background:#fff;border-radius:16px;padding:24px;margin:30px 0}.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.social a{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);font-size:14px;transition:.15s}.social a:hover{border-color:var(--blue);background:#fafcff}.social .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:bold}
/* 安全提醒 */
.safety{background:linear-gradient(135deg,#e6f4ea,#f1f8e9);border-radius:16px;padding:24px;margin:30px 0;display:flex;gap:16px;align-items:flex-start}.safety .ic{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}.safety h3{margin:0 0 6px;color:var(--green)}.safety p{margin:0;color:#2e7d32;line-height:1.7;font-size:14px}
footer{text-align:center;color:#8a99a9;font-size:12px;padding:30px 0 45px}
/* 普通用户后台 */
#myView .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
#myView .card h2{margin-top:0}
#myView label{display:block;margin-top:8px;font-size:14px}
#myView input,#myView textarea,#myView select{width:100%;padding:10px;border:1px solid #d6e2ed;border-radius:9px;margin:5px 0 10px;font:inherit;background:#fff}
#myView input[type=file]{padding:7px;border:1px dashed #c9d8e6;background:#fafcfe}
#myView button{border:0;background:var(--blue);color:#fff;padding:10px 16px;border-radius:9px;cursor:pointer;margin:3px;font-size:14px}
#myView button.danger{background:#b3261e}#myView button.ghost{background:#5f6b7a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.preview-img{max-width:220px;max-height:140px;object-fit:cover;border-radius:9px;display:block;margin:5px 0}
.upload-row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.upload-btn{display:inline-block;background:#0d47a1;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.upload-btn:hover{filter:brightness(.92)}
.upload-btn.has-file{background:#137333}
.hidden-file{position:absolute;opacity:0;width:0;height:0;overflow:hidden}
.upload-status{font-size:13px;color:#71859a}
.upload-status.ok{color:#137333}.upload-status.err{color:#b3261e}.upload-status.wait{color:#8a5a00}
.mjob{border-top:1px solid #edf2f6;padding:12px 0}.mjob .ops{margin-top:6px}.mjob .ops button{padding:7px 12px;font-size:13px;margin-right:5px}.mjob .ops button.danger{background:#b3261e}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;margin-left:6px}.badge.pending{background:#fef7e0;color:#8a5a00}.badge.approved{background:#e6f4ea;color:#137333}.badge.rejected{background:#fce8e6;color:#b3261e}
.backbtn{border:0;background:#e6ecf3;color:var(--text);padding:10px 16px;border-radius:9px;cursor:pointer;font-size:14px;margin-bottom:12px}
/* modal */
.modal-mask{position:fixed;inset:0;background:#143c6470;display:none;align-items:center;justify-content:center;z-index:50}.modal{background:#fff;border-radius:16px;padding:22px;width:min(420px,92%);max-height:90vh;overflow:auto}.modal h3{margin-top:0}.modal label{display:block;margin-top:6px;font-size:14px}.modal input{width:100%;padding:11px;border:1px solid #d6e2ed;border-radius:9px;margin:6px 0 12px;font:inherit}.modal button{border:0;background:var(--blue);color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer;margin:3px;font-size:15px}.modal .err{color:#b3261e;font-size:13px;min-height:16px}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center}.hero-logo{width:140px;height:140px}.hero-logo .hu{font-size:36px}.about{grid-template-columns:1fr}.jobs{grid-template-columns:1fr}.cat-cards{grid-template-columns:1fr}.social-grid{grid-template-columns:1fr}.row2,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap"><a class="brand" onclick="showPublic()"><div class="logo">海大</div><b id="brandTitle">海南大学兼职公开榜</b></a><div class="topauth" id="authArea"></div></div></div>

<main class="wrap">
<div id="publicView">
  <section class="hero">
    <div><div class="sub" id="heroSub">HAINAN UNIVERSITY PART-TIME BOARD</div><h1 id="heroTitle">海南大学兼职公开榜</h1><p id="heroDesc">最全面的校园兼职信息平台，实时更新优质岗位。</p><div class="btns"><button class="primary" onclick="document.getElementById('jobSection').scrollIntoView({behavior:'smooth'})">浏览兼职</button><button class="outline" onclick="document.getElementById('aboutSection').scrollIntoView({behavior:'smooth'})">了解平台</button></div></div>
    <div class="hero-logo"><div class="hu">HU</div><span>海南大学兼职公开榜</span></div>
  </section>
  <section class="about" id="aboutSection"><div><h2 id="aboutTitle">让校园信息更容易找到</h2></div><div><p id="aboutText">海南大学兼职公开榜致力于为海南大学学子提供安全、可靠的兼职信息平台。所有信息均经审核，确保真实有效。</p></div></section>

  <section class="section" id="jobSection">
    <div class="section-head"><h2>兼职信息筛选</h2><span class="more" id="totalCnt">加载中…</span></div>
    <div class="sub-label">类别</div>
    <div class="chips" id="cat1Chips"></div>
    <div id="cat2Wrap" style="display:none"><div class="sub-label" id="cat2Label">城市</div><div class="chips" id="cat2Chips"></div></div>
    <div id="cat3Wrap" style="display:none"><div class="sub-label" id="cat3Label">区县</div><div class="chips" id="cat3Chips"></div></div>
    <div id="ratioWrap" style="margin-top:14px"></div>
    <div class="sub-label" style="margin-top:18px">标签(可多选)</div>
    <div class="chips" id="tagChips"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2 id="listTitle">最新信息</h2><span class="more" id="resultCnt"></span></div>
    <div class="jobs" id="jobs"></div>
  </section>

  <section class="social" id="socialSection"><div class="section-head" style="margin:0"><h2>官方渠道</h2></div><div class="social-grid" id="socialGrid"></div></section>
  <section class="safety" id="safetySection"><div class="ic">!</div><div><h3>官方安全提醒</h3><p id="safetyText">任何要求先交押金、培训费的兼职均为诈骗，请提高警惕。</p></div></section>
</div>

<div id="myView" style="display:none">
  <button class="backbtn" onclick="showPublic()">← 返回公开列表</button>
  <div class="card"><h2>我的兼职后台</h2><p style="color:var(--muted);font-size:13px">发布后进入「待审核」，管理员审核通过后公开展示。</p><button onclick="togglePublish()">+ 发布兼职</button>
    <div id="pubForm" style="display:none">
      <label id="lb_title">标题 *</label><input id="mf_title">
      <div class="row3"><div><label id="lb_cat">类别</label><select id="mf_cat" onchange="fillSub2('mf_cat','mf_sub','mf_sub2')"></select></div><div><label id="lb_sub">城市</label><select id="mf_sub" onchange="fillSub3('mf_cat','mf_sub','mf_sub2')"></select></div><div><label id="lb_sub2">区县</label><select id="mf_sub2"></select></div></div>
      <label id="lb_desc">描述</label><textarea id="mf_desc" placeholder="工作内容、要求等"></textarea>
      <div class="row2"><div><label id="lb_salary">薪资</label><input id="mf_salary" placeholder="如：150元/天"></div><div><label id="lb_loc">地点</label><input id="mf_loc"></div></div>
      <label id="lb_contact">个人联系方式</label><input id="mf_contact">
      <label>个人联系方式超链接（点击跳转）</label><input id="mf_contactlink" placeholder="https://...">
      <label>双向联系</label><input id="mf_contact2">
      <label>双向联系超链接（点击跳转）</label><input id="mf_contact2link" placeholder="https://...">
      <label>个人频道</label><input id="mf_contact3">
      <label>个人频道超链接（点击跳转）</label><input id="mf_contact3link" placeholder="https://...">
      <label id="lb_tags">自定义标签（逗号分隔）</label><input id="mf_tags">
      <label id="lb_img">封面图片</label>
      <div class="upload-row">
        <input id="mf_img" type="file" accept="image/*" class="hidden-file">
        <label for="mf_img" class="upload-btn" id="mf_imgBtn">选择图片上传</label>
        <span id="mf_imgStatus" class="upload-status"></span>
      </div>
      <img id="mf_imgPrev" class="preview-img" style="display:none">
      <label>图片超链接（点击跳转）</label><input id="mf_imagelink" placeholder="https://...">
      <div><button id="btn_submit" onclick="submitMine()">提交（等待审核）</button><button class="ghost" onclick="togglePublish(true)">取消</button></div>
    </div>
  </div>
  <div class="card"><h2>我发布的兼职</h2><div id="myJobs"></div></div>
</div>
</main>
<footer>海南大学兼职公开榜</footer>
<div class="modal-mask" id="modalMask"><div class="modal"><div id="modalBody"></div></div></div>

<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pad=n=>n<10?"0"+n:""+n;
function fmt(iso){const d=new Date(iso);if(isNaN(d))return iso||"";return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseTags(s){return String(s||"").split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean)}
function fileToBase64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const r=fr.result,i=r.indexOf(",");res(i>=0?r.slice(i+1):r)};fr.onerror=rej;fr.readAsDataURL(file)})}
const DEFAULTS={site_title:"海南大学兼职公开榜",site_subtitle:"HAINAN UNIVERSITY PART-TIME BOARD",hero_title:"海南大学兼职公开榜",hero_description:"最全面的校园兼职信息平台，实时更新优质岗位。",about_title:"让校园信息更容易找到",about_text:"海南大学兼职公开榜致力于为海南大学学子提供安全、可靠的兼职信息平台。所有信息均经审核，确保真实有效。",safety_notice:"任何要求先交押金、培训费的兼职均为诈骗，请提高警惕。如遇可疑信息，请立即举报。"};
let categories=[],jobs=[],cfg=DEFAULTS,activeCat="all",activeSub="all",activeSub2="all",activeTags=[],me=sessionStorage.getItem("gh_me")||null,editingMineId=null,WORKER_URL="";

function contactHTML(c){if(!c)return"";c=String(c).trim();if(/^https?:\/\//i.test(c))return'<a href="'+esc(c)+'" target="_blank" rel="noopener">'+esc(c)+"</a>";if(/^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(c))return'<a href="mailto:'+esc(c)+'">'+esc(c)+"</a>";if(/^[\d\s+-]{7,}$/.test(c))return'<a href="tel:'+esc(c.replace(/\s/g,""))+'">'+esc(c)+"</a>";return esc(c)}
function catObj(slug){return categories.find(x=>x.slug===slug)||{subcategories:[]}}
function catName(slug){const c=catObj(slug);return c?c.name:""}
function subName(catSlug,subSlug){const s=(catObj(catSlug).subcategories||[]).find(x=>x.slug===subSlug);return s?s.name:""}
function sub2Name(catSlug,subSlug,sub2Slug){const s=(catObj(catSlug).subcategories||[]).find(x=>x.slug===subSlug);const t=(s&&s.subcategories||[]).find(x=>x.slug===sub2Slug);return t?t.name:""}

async function getJson(f){const r=await fetch("./data/"+f+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()}
async function loadConfig(){try{const c=await getJson("config.json");cfg=Object.assign({},DEFAULTS,c);WORKER_URL=c.worker_url||""}catch(e){cfg=DEFAULTS}
  document.title=cfg.site_title||DEFAULTS.site_title;
  document.getElementById("brandTitle").textContent=cfg.site_title||DEFAULTS.site_title;
  document.getElementById("heroSub").textContent=cfg.site_subtitle||DEFAULTS.site_subtitle;
  document.getElementById("heroTitle").textContent=cfg.hero_title||DEFAULTS.hero_title;
  document.getElementById("heroDesc").textContent=cfg.hero_description||DEFAULTS.hero_description;
  document.getElementById("aboutTitle").textContent=cfg.about_title||DEFAULTS.about_title;
  document.getElementById("aboutText").textContent=cfg.about_text||DEFAULTS.about_text;
  document.getElementById("safetyText").textContent=cfg.safety_notice||DEFAULTS.safety_notice;
  if(cfg.background_image)document.body.style.backgroundImage='url("'+cfg.background_image+'")';
  renderSocial();applyFormLabels();
}
function applyFormLabels(){
  const fl=cfg.form_labels||{},fp=cfg.form_placeholders||{};
  const setL=(id,txt)=>{const el=document.getElementById(id);if(el&&txt)el.textContent=txt};
  const setP=(id,txt)=>{const el=document.getElementById(id);if(el&&txt)el.placeholder=txt};
  setL('lb_title',fl.title);setL('lb_cat',fl.cat);setL('lb_sub',fl.sub);setL('lb_sub2',fl.sub2);
  setL('lb_desc',fl.desc);setL('lb_salary',fl.salary);setL('lb_loc',fl.loc);
  setL('lb_contact',fl.contact);setL('lb_tags',fl.tags);setL('lb_img',fl.img);
  setL('btn_submit',fl.submit);
  setP('mf_title',fp.title);setP('mf_desc',fp.desc);setP('mf_salary',fp.salary);
  setP('mf_loc',fp.loc);setP('mf_contact',fp.contact);setP('mf_tags',fp.tags);
}
function renderSocial(){
  const links=cfg.social_links||[];
  const grid=document.getElementById("socialGrid");
  if(!grid)return;
  if(!links.length){grid.innerHTML='<p class="muted">暂无官方渠道</p>';return}
  grid.innerHTML=links.map((s,i)=>{
    const ic=s.icon?`<img src="${esc(s.icon)}" style="width:28px;height:28px;border-radius:8px;object-fit:cover">`:`<div class="ic" style="background:${esc(s.color||'#0d47a1')}">${esc((s.name||'?').slice(0,2))}</div>`;
    return s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${ic}${esc(s.name||'渠道')}</a>`:`<a style="opacity:.4;cursor:default">${ic}${esc(s.name||'渠道')}（未配置链接）</a>`;
  }).join("");
}
async function wApi(path,body){if(!WORKER_URL)throw new Error("站点暂未开放普通用户功能（管理员尚未配置后端）");const r=await fetch(WORKER_URL.replace(/\/+$/,"")+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));return d}

/* ====== 公开视图 ====== */
async function init(){renderAuth();await loadConfig();try{[categories,jobs]=await Promise.all([getJson("categories.json"),getJson("jobs.json")])}catch(e){categories=[];jobs=[]}jobs=jobs.filter(j=>j.status==="approved");renderAll()}
function renderAll(){renderCat1Chips();renderCat2Chips();renderCat3Chips();renderTagChips();renderRatios();renderJobs()}
function filteredJobs(){
  let list=jobs;
  if(activeCat!=="all")list=list.filter(j=>j.category===activeCat);
  if(activeSub!=="all")list=list.filter(j=>j.subcategory===activeSub);
  if(activeSub2!=="all")list=list.filter(j=>j.subcategory2===activeSub2);
  if(activeTags.length)list=list.filter(j=>(j.tags||[]).some(t=>activeTags.includes(t)));
  return list.slice().sort((a,b)=>(b.views||0)-(a.views||0));
}

function setCat1(slug){activeCat=slug;activeSub="all";activeSub2="all";activeTags=[];renderAll()}
function renderCat2Chips(){

function setCat2(slug){activeSub=slug;activeSub2="all";activeTags=[];renderAll()}
function renderCat3Chips(){

  if(activeCat==="all"||activeSub==="all"){wrap.style.display="none";return}
  const s=(catObj(activeCat).subcategories||[]).find(x=>x.slug===activeSub),subs=(s&&s.subcategories)||[];

  wrap.style.display="";document.getElementById("cat3Label").textContent=subName(activeCat,activeSub)+" · 区县";
  const subJobs=jobs.filter(j=>j.category===activeCat&&j.subcategory===activeSub);

  html+=subs.map(t=>{const n=subJobs.filter(j=>j.subcategory2===t.slug).length;return `<button class="chip ${activeSub2===t.slug?"active":""}" onclick="setCat3('${esc(t.slug)}')">${esc(t.name)} <span class="cnt">${n}</span></button>`}).join("");
  document.getElementById("cat3Chips").innerHTML=html;
}
function setCat3(slug){activeSub2=slug;activeTags=[];renderAll()}
function renderTagChips(){
  const allTags={};jobs.forEach(j=>(j.tags||[]).forEach(t=>allTags[t]=(allTags[t]||0)+1));
  const tags=Object.entries(allTags).sort((a,b)=>b[1]-a[1]);
  let html=`<button class="chip ${!activeTags.length?"active":""}" onclick="clearTags()">全部标签</button>`;
  html+=tags.map(([t,n])=>`<button class="chip ${activeTags.includes(t)?"active":""}" onclick="toggleTag('${esc(t)}')">${esc(t)} <span class="cnt">${n}</span></button>`).join("");
  document.getElementById("tagChips").innerHTML=tags.length?html:'<span style="color:var(--muted);font-size:13px">暂无标签</span>';
}
function toggleTag(t){
  if(activeTags.includes(t))activeTags=activeTags.filter(x=>x!==t);
  else activeTags.push(t);
  renderAll();
}
function clearTags(){activeTags=[];renderAll()}
function renderRatios(){document.getElementById("ratioWrap").innerHTML=""}
function renderJobs(){
  const list=filteredJobs();
  let title="最新信息";
  if(activeCat!=="all"){title=catName(activeCat);if(activeSub!=="all")title+=" / "+subName(activeCat,activeSub);if(activeSub2!=="all")title+=" / "+sub2Name(activeCat,activeSub,activeSub2)}
  if(activeTags.length)title+=" · #"+activeTags.join(" #");

  document.getElementById("resultCnt").textContent=list.length+" 条";
  document.getElementById("jobs").innerHTML=list.length?list.map(j=>`<article class="job" onclick="viewJob('${esc(j.id)}')">${j.image?(j.image_link?`<a href="${esc(j.image_link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><img class="job-img" src="${esc(j.image)}" alt="${esc(j.title)}" loading="lazy"></a>`:`<img class="job-img" src="${esc(j.image)}" alt="${esc(j.title)}" loading="lazy">`):""}<div class="cats"><span class="tag">${esc(catName(j.category)||"兼职")}</span>${j.subcategory?`<span class="tag sub">${esc(subName(j.category,j.subcategory))}</span>`:""}${j.subcategory2?`<span class="tag sub2">${esc(sub2Name(j.category,j.subcategory,j.subcategory2))}</span>`:""}</div><h3>${esc(j.title)}</h3><div class="meta">${esc(j.location||"")}${j.time?" · "+esc(j.time):""}</div>${j.salary?`<div class="salary">${esc(j.salary)}</div>`:""}${j.tags&&j.tags.length?`<div class="jtags">${j.tags.map(t=>`<span class="jtag ${activeTags.includes(t)?"active":""}" onclick="event.stopPropagation();toggleTag('${esc(t)}')">#${esc(t)}</span>`).join("")}</div>`:""}<p>${esc(j.description||"")}</p>${renderContacts(j)}<div class="views">👁 ${j.views||0}</div></article>`).join(""):'<div class="empty">暂无兼职信息</div>';
}

function renderContacts(j){
  let html="";
  [{label:"个人联系方式",val:j.contact,link:j.contact_link},{label:"双向联系",val:j.contact2,link:j.contact2_link},{label:"个人频道",val:j.contact3,link:j.contact3_link}].forEach(item=>{
    if(item.val){html+=`<p class="contact"><b>${item.label}：</b>${item.link?`<a href="${esc(item.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(item.val)}</a>`:contactHTML(item.val)}</p>`}
  });
  return html;
}
function viewJob(id){
  if(!WORKER_URL||!id)return;
  if(sessionStorage.getItem("viewed_"+id))return;
  sessionStorage.setItem("viewed_"+id,"1");
  wApi("/api/view",{id:id}).catch(()=>{});

/* ====== 认证 ====== */
function renderAuth(){const a=document.getElementById("authArea");if(me){a.innerHTML='<span class="who">'+esc(me)+'</span><button class="ghost" onclick="showMyView()">我的后台</button><button onclick="doLogout()">退出</button>'}else{a.innerHTML='<button class="ghost" onclick="openModal(regForm)">注册</button><button onclick="openModal(loginForm)">登录</button>'}}
const regForm=`<h3>注册普通用户</h3><label>用户名</label><input id="ru" placeholder="2-20位"><label>密码</label><input id="rp" type="password" placeholder="至少6位"><label>确认密码</label><input id="rp2" type="password"><div class="err" id="regErr"></div><button onclick="doRegister()">注册并登录</button>`;
const loginForm=`<h3>普通用户登录</h3><label>用户名</label><input id="lu"><label>密码</label><input id="lp" type="password"><div class="err" id="loginErr"></div><button onclick="doLogin()">登录</button>`;
function openModal(html){
  if(!WORKER_URL&&(html===regForm||html===loginForm)){
    html='<h3>注册 / 登录暂未开放</h3><p style="color:#71859a;line-height:1.7">管理员尚未配置后端服务（Cloudflare Worker），普通用户注册、登录、发布功能暂不可用。<br><br>请联系网站管理员开启后再试。</p>'
  }
  document.getElementById("modalBody").innerHTML=html;document.getElementById("modalMask").style.display="flex"
}
function closeModal(){document.getElementById("modalMask").style.display="none"}
window.addEventListener("click",e=>{if(e.target.id==="modalMask")closeModal()});
async function doRegister(){const u=document.getElementById("ru").value.trim(),p=document.getElementById("rp").value,p2=document.getElementById("rp2").value,e=document.getElementById("regErr");if(!/^[\w\u4e00-\u9fa5-]{2,20}$/.test(u)){e.textContent="用户名需为2-20位";return}if(p.length<6){e.textContent="密码至少6位";return}if(p!==p2){e.textContent="两次密码不一致";return}try{await wApi("/api/register",{username:u,password:p});me=u;sessionStorage.setItem("gh_me",u);closeModal();renderAuth();showMyView()}catch(err){e.textContent=err.message}}
async function doLogin(){const u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,e=document.getElementById("loginErr");try{await wApi("/api/login",{username:u,password:p});me=u;sessionStorage.setItem("gh_me",u);closeModal();renderAuth();showMyView()}catch(err){e.textContent=err.message}}
function doLogout(){me=null;sessionStorage.removeItem("gh_me");renderAuth();showPublic()}

/* ====== 视图切换 ====== */
function showPublic(){editingMineId=null;activeCat="all";activeSub="all";activeSub2="all";activeTags=[];document.getElementById("publicView").style.display="";document.getElementById("myView").style.display="none";init()}
function showMyView(){document.getElementById("publicView").style.display="none";document.getElementById("myView").style.display="";loadMine()}
function fillCat(id,val){const s=document.getElementById(id);if(!s)return;s.innerHTML=categories.filter(c=>c.enabled!==false).map(c=>`<option value="${esc(c.slug)}"${c.slug===val?" selected":""}>${esc(c.name)}</option>`).join("")}
function fillSub2(catId,subId,sub2Id){const cat=document.getElementById(catId),sub=document.getElementById(subId);if(!cat||!sub)return;const c=catObj(cat.value);sub.innerHTML='<option value="">（不选）</option>'+(c.subcategories||[]).map(s=>`<option value="${esc(s.slug)}">${esc(s.name)}</option>`).join("");if(sub2Id)fillSub3(catId,subId,sub2Id)}
function fillSub3(catId,subId,sub2Id){const cat=document.getElementById(catId),sub=document.getElementById(subId),s2=document.getElementById(sub2Id);if(!cat||!sub||!s2)return;const c=catObj(cat.value);const s=(c.subcategories||[]).find(x=>x.slug===sub.value);s2.innerHTML='<option value="">（不选）</option>'+((s&&s.subcategories)||[]).map(t=>`<option value="${esc(t.slug)}">${esc(t.name)}</option>`).join("")}
let _mf_imgUrl="",_mj_imgUrl="";
async function bindUpload(inputId,btnId,prevId,statusId,urlKey){
  const inp=document.getElementById(inputId),btn=document.getElementById(btnId),prev=document.getElementById(prevId),status=document.getElementById(statusId);
  if(!inp||!btn)return;
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f){prev.style.display="none";status.textContent="";btn.classList.remove("has-file");btn.textContent="选择图片上传";return}
    status.textContent="正在上传…";status.className="upload-status wait";btn.textContent="上传中…";btn.disabled=true;
    try{
      const b64=await fileToBase64(f);
      const r=await wApi("/api/upload-image",{username:me,filename:f.name,content:b64});
      window[urlKey]=r.path;
      prev.src=r.path;prev.style.display="block";
      status.textContent="上传成功";status.className="upload-status ok";
      btn.textContent="重新选择";btn.classList.add("has-file");btn.disabled=false;
    }catch(e){
      status.textContent="上传失败："+e.message;status.className="upload-status err";
      btn.textContent="选择图片上传";btn.disabled=false;
    }
  }
}

/* ====== 普通用户后台 ====== */
function togglePublish(forceHide){const w=document.getElementById("pubForm");if(forceHide||w.style.display!=="none"){w.style.display="none";return}fillCat("mf_cat","");fillSub2("mf_cat","mf_sub","mf_sub2");_mf_imgUrl="";bindUpload("mf_img","mf_imgBtn","mf_imgPrev","mf_imgStatus","_mf_imgUrl");w.style.display="block"}
async function loadMine(){fillCat("mf_cat","");fillSub2("mf_cat","mf_sub","mf_sub2");_mf_imgUrl="";bindUpload("mf_img","mf_imgBtn","mf_imgPrev","mf_imgStatus","_mf_imgUrl");const el=document.getElementById("myJobs");if(!WORKER_URL){el.innerHTML='<p class="empty">站点暂未开放普通用户功能：管理员尚未配置后端。</p>';return}try{const d=await wApi("/api/my-jobs",{username:me});jobs=d.jobs||[];el.innerHTML=jobs.map(renderMine).join("")||'<p class="empty">你还没有发布过兼职。</p>'}catch(e){el.innerHTML='<p class="empty">加载失败：'+esc(e.message)+'</p>'}}
function renderMine(j){
  if(j.id===editingMineId){return `<div class="mjob"><b>编辑兼职</b><label>标题</label><input id="mj_title" value="${esc(j.title)}"><div class="row3"><div><label>一级</label><select id="mj_cat" onchange="fillSub2('mj_cat','mj_sub','mj_sub2')"></select></div><div><label>二级</label><select id="mj_sub" onchange="fillSub3('mj_cat','mj_sub','mj_sub2')"></select></div><div><label>三级</label><select id="mj_sub2"></select></div></div><label>描述</label><textarea id="mj_desc">${esc(j.description||"")}</textarea><div class="row2"><div><label>薪资</label><input id="mj_salary" value="${esc(j.salary||"")}"></div><div><label>地点</label><input id="mj_loc" value="${esc(j.location||"")}"></div></div><label>个人联系方式</label><input id="mj_contact" value="${esc(j.contact||"")}"><label>个人联系方式超链接</label><input id="mj_contactlink" value="${esc(j.contact_link||"")}"><label>双向联系</label><input id="mj_contact2" value="${esc(j.contact2||"")}"><label>双向联系超链接</label><input id="mj_contact2link" value="${esc(j.contact2_link||"")}"><label>个人频道</label><input id="mj_contact3" value="${esc(j.contact3||"")}"><label>个人频道超链接</label><input id="mj_contact3link" value="${esc(j.contact3_link||"")}"><label>标签</label><input id="mj_tags" value="${esc((j.tags||[]).join(","))}"><label>封面图片</label><div class="upload-row"><input id="mj_img" type="file" accept="image/*" class="hidden-file"><label for="mj_img" class="upload-btn" id="mj_imgBtn">选择图片上传</label><span id="mj_imgStatus" class="upload-status"></span></div><img id="mj_imgPrev" class="preview-img"${j.image?` src="${esc(j.image)}"`:' style="display:none"'}><label>图片超链接（点击跳转）</label><input id="mj_imagelink" value="${esc(j.image_link||"")}"><div class="ops"><button onclick="saveMineEdit('${j.id}')">保存</button><button class="danger" onclick="removeMineImg()">移除图片</button><button class="ghost" onclick="cancelMineEdit()">取消</button></div></div>`}
  const b=j.status==="approved"?'<span class="badge approved">已通过·主页可见</span>':(j.status==="rejected"?'<span class="badge rejected">已拒绝</span>':'<span class="badge pending">待审核</span>');
  return `<div class="mjob"><b>${esc(j.title)}</b>${b}<div style="color:var(--muted);font-size:13px">${esc(catName(j.category)+(j.subcategory?(" / "+subName(j.category,j.subcategory)):"")+(j.subcategory2?(" / "+sub2Name(j.category,j.subcategory,j.subcategory2)):"")+"　"+fmt(j.created_at))}</div>${j.description?`<p>${esc(j.description)}</p>`:""}<div class="ops"><button onclick="editMine('${j.id}')">编辑</button><button class="danger" onclick="delMine('${j.id}')">删除</button></div></div>`;
}
async function editMine(id){editingMineId=id;await loadMine();const j=jobs.find(x=>x.id===id);if(j){fillCat("mj_cat",j.category);fillSub2("mj_cat","mj_sub","mj_sub2");if(j.subcategory)document.getElementById("mj_sub").value=j.subcategory;fillSub3("mj_cat","mj_sub","mj_sub2");if(j.subcategory2)document.getElementById("mj_sub2").value=j.subcategory2}_mj_imgUrl=j?j.image||"":"";bindUpload("mj_img","mj_imgBtn","mj_imgPrev","mj_imgStatus","_mj_imgUrl");if(j&&j.image){const btn=document.getElementById("mj_imgBtn");if(btn){btn.textContent="重新选择";btn.classList.add("has-file")}}}
function cancelMineEdit(){editingMineId=null;loadMine()}
window.removeMineImg=function(){const p=document.getElementById("mj_imgPrev");if(p){p.style.display="none";p.removeAttribute("src")}const btn=document.getElementById("mj_imgBtn");if(btn){btn.textContent="选择图片上传";btn.classList.remove("has-file")}const st=document.getElementById("mj_imgStatus");if(st)st.textContent="";_mj_imgUrl="";window._rmMineImg=true}
async function submitMine(){const title=document.getElementById("mf_title").value.trim();if(!title){alert("请输入标题");return}try{await wApi("/api/publish",{username:me,job:{title:title,description:document.getElementById("mf_desc").value,category:document.getElementById("mf_cat").value,subcategory:document.getElementById("mf_sub").value,subcategory2:document.getElementById("mf_sub2").value,salary:document.getElementById("mf_salary").value,location:document.getElementById("mf_loc").value,contact:document.getElementById("mf_contact").value,contact_link:document.getElementById("mf_contactlink").value.trim(),contact2:document.getElementById("mf_contact2").value,contact2_link:document.getElementById("mf_contact2link").value.trim(),contact3:document.getElementById("mf_contact3").value,contact3_link:document.getElementById("mf_contact3link").value.trim(),image:_mf_imgUrl||"",image_link:document.getElementById("mf_imagelink").value.trim(),tags:parseTags(document.getElementById("mf_tags").value)}});["mf_title","mf_desc","mf_salary","mf_loc","mf_contact","mf_contactlink","mf_contact2","mf_contact2link","mf_contact3","mf_contact3link","mf_tags","mf_imagelink"].forEach(i=>document.getElementById(i).value="");document.getElementById("mf_img").value="";document.getElementById("mf_imgPrev").style.display="none";document.getElementById("mf_imgStatus").textContent="";document.getElementById("mf_imgBtn").textContent="选择图片上传";document.getElementById("mf_imgBtn").classList.remove("has-file");_mf_imgUrl="";togglePublish(true);loadMine();alert("已提交，等待管理员审核")}catch(e){alert("发布失败："+e.message)}}
async function saveMineEdit(id){try{let image=undefined;if(window._rmMineImg){image=""}else if(_mj_imgUrl){image=_mj_imgUrl}await wApi("/api/update-job",{username:me,id:id,job:{title:document.getElementById("mj_title").value.trim(),description:document.getElementById("mj_desc").value,category:document.getElementById("mj_cat").value,subcategory:document.getElementById("mj_sub").value,subcategory2:document.getElementById("mj_sub2").value,salary:document.getElementById("mj_salary").value,location:document.getElementById("mj_loc").value,contact:document.getElementById("mj_contact").value,contact_link:document.getElementById("mj_contactlink").value.trim(),contact2:document.getElementById("mj_contact2").value,contact2_link:document.getElementById("mj_contact2link").value.trim(),contact3:document.getElementById("mj_contact3").value,contact3_link:document.getElementById("mj_contact3link").value.trim(),tags:parseTags(document.getElementById("mj_tags").value),image:image,image_link:document.getElementById("mj_imagelink").value.trim()}});editingMineId=null;window._rmMineImg=false;_mj_imgUrl="";loadMine();alert("修改已提交，等待管理员重新审核")}catch(e){alert("保存失败："+e.message)}}
async function delMine(id){if(!confirm("确定删除？"))return;try{await wApi("/api/delete-job",{username:me,id});loadMine()}catch(e){alert("删除失败："+e.message)}}

init().catch(e=>{document.querySelector("#jobs").innerHTML='<div class="empty">数据加载失败，请刷新</div>';console.error(e)});
