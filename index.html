<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="海南大学兼职公开榜">
<title>海南大学兼职公开榜</title>
<style>
:root{--blue:#0d47a1;--text:#183b60;--muted:#71859a;--bg:#f4f7fb;--line:#e0e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
.wrap{width:min(1120px,94%);margin:auto}.hero{padding:40px 0 22px}.hero h1{font-size:clamp(30px,6vw,48px);margin:0}.hero p{color:var(--muted)}
.title{display:flex;justify-content:space-between;align-items:end}.title h2{font-size:22px}.count{color:var(--muted);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.filter{padding:0;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;text-align:left;cursor:pointer;box-shadow:0 5px 18px #143c6410}.filter.active{outline:3px solid #d6e7ff}.filter img{width:100%;height:110px;object-fit:cover}.body{padding:12px}.body h3{margin:0 0 6px}.body p{color:var(--muted);font-size:13px;min-height:35px;line-height:1.45}.bar{height:7px;background:#e9eff5;border-radius:8px}.bar i{display:block;height:100%;background:var(--blue);border-radius:8px}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.job{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;overflow:hidden}.job-img{width:100%;height:160px;object-fit:cover;border-radius:10px;margin:0 0 12px;display:block;background:#eef2f7}.tag{color:var(--blue);background:#eef5ff;border-radius:20px;padding:4px 9px;font-size:12px}.meta{color:var(--muted);font-size:13px}.empty{grid-column:1/-1;background:#fff;padding:45px;text-align:center;color:var(--muted);border-radius:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.jtag{background:#eef5ff;color:var(--blue);border-radius:20px;padding:3px 10px;font-size:12px}.salary{color:#0d47a1;font-weight:bold;margin:6px 0}
footer{text-align:center;color:#8a99a9;font-size:12px;padding:30px 0 45px}
@media(max-width:820px){.filters{grid-template-columns:repeat(2,1fr)}.jobs{grid-template-columns:1fr}}
@media(max-width:430px){.wrap{width:92%}.filter img{height:90px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><h1>海南大学兼职公开榜</h1><p>审核通过的兼职信息公开展示</p></section>
<section><div class="title"><h2>兼职筛选</h2><span id="total" class="count">加载中…</span></div><div id="filters" class="filters"></div></section>
<section><div class="title"><h2 id="listTitle">全部兼职</h2><span id="resultCount" class="count"></span></div><div id="jobs" class="jobs"></div></section>
</main><footer>海南大学兼职公开榜</footer>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let categories=[],jobs=[],active="all";
async function getJson(f){const r=await fetch("./data/"+f+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()}
async function init(){[categories,jobs]=await Promise.all([getJson("categories.json"),getJson("jobs.json")]);jobs=jobs.filter(j=>j.status==="approved");renderFilters();renderJobs()}
function renderFilters(){
 const total=jobs.length,enabled=categories.filter(c=>c.enabled).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
 document.querySelector("#total").textContent=`共 ${total} 条信息`;
 document.querySelector("#filters").innerHTML=`<button class="filter active" data-slug="all"><div class="body"><h3>全部兼职</h3><p>查看所有已审核兼职信息</p><div class="bar"><i style="width:100%"></i></div></div></button>`+
 enabled.map(c=>{const n=jobs.filter(j=>j.category===c.slug).length,p=total?Math.round(n/total*100):0;return `<button class="filter" data-slug="${esc(c.slug)}">${c.image?`<img src="${esc(c.image)}" alt="${esc(c.name)}">`:``}<div class="body"><h3>${esc(c.name)}</h3><p>${esc(c.description||"")}</p><div class="bar"><i style="width:${p}%"></i></div></div></button>`}).join("");
 document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{active=b.dataset.slug;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderJobs()})
}
function renderJobs(){
 const c=categories.find(x=>x.slug===active),list=active==="all"?jobs:jobs.filter(j=>j.category===active);
 document.querySelector("#listTitle").textContent=active==="all"?"全部兼职":(c?.name||"兼职");
 document.querySelector("#resultCount").textContent=`${list.length} 条`;
 document.querySelector("#jobs").innerHTML=list.length?list.map(j=>`<article class="job">${j.image?`<img class="job-img" src="${esc(j.image)}" alt="${esc(j.title)}" loading="lazy">`:""}<span class="tag">${esc(j.category_name||j.category||"兼职")}</span><h3>${esc(j.title)}</h3><div class="meta">${esc(j.location||"")}${j.time?" · "+esc(j.time):""}</div>${j.salary?`<div class="salary">${esc(j.salary)}</div>`:""}${j.tags&&j.tags.length?`<div class="tags">${j.tags.map(t=>`<span class="jtag">${esc(t)}</span>`).join("")}</div>`:""}<p>${esc(j.description||"")}</p>${j.contact?`<p><b>联系方式：</b>${esc(j.contact)}</p>`:""}</article>`).join(""):'<div class="empty">暂无已审核信息</div>'
}
init().catch(e=>{document.querySelector("#jobs").innerHTML='<div class="empty">数据加载失败，请刷新页面</div>';console.error(e)});
</script>
</body></html>
