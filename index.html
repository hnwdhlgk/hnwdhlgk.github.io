<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网站管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#183b60;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{width:min(1080px,94%);margin:25px auto}.card{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:20px;margin-bottom:16px}h1{margin-top:0}.muted{color:#71859a;font-size:13px}.ok{color:#137333}.err{color:#b3261e}.wait{color:#8a5a00}.notice{padding:12px;border-radius:9px;background:#f6f8fa;margin-top:10px;white-space:pre-wrap;line-height:1.6}label{display:block;margin-top:8px}input,textarea{width:100%;padding:11px;border:1px solid #d6e2ed;border-radius:9px;margin:6px 0 12px;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;background:#0d47a1;color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer;margin:3px;font-size:15px}button:hover{filter:brightness(.92)}button:disabled{opacity:.55;cursor:not-allowed}.danger{background:#b3261e}.gray{background:#607d8b}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border-top:1px solid #edf2f6;padding:15px 0}.toolbar{display:flex;align-items:center;flex-wrap:wrap}.badge{display:inline-block;padding:3px 8px;border-radius:20px;background:#edf2f7;font-size:12px}.empty{padding:18px;text-align:center;color:#71859a;background:#f8fafc;border-radius:9px}@media(max-width:700px){.wrap{width:94%;margin:15px auto}.card{padding:15px}.row{grid-template-columns:1fr}h1{font-size:24px}button{padding:10px 14px}}
</style>
</head>
<body>
<div class="wrap">
<h1>网站管理后台</h1>
<div id="login" class="card">
<h2>GitHub 授权</h2>
<p class="muted">纯 GitHub 无服务器后台。Token 只保存在当前浏览器会话。</p>
<label for="user">GitHub 用户名</label>
<input id="user" value="hnwdhlgk" autocomplete="username">
<label for="repo">仓库</label>
<input id="repo" value="hnwdhlgk.github.io" autocomplete="off">
<label for="token">Fine-grained Token</label>
<input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
<button id="connectBtn" type="button">连接</button>
<button id="clearBtn" type="button" class="gray">清除登录信息</button>
<div id="msg" class="notice muted">后台脚本正在加载…</div>
</div>
<div id="app" style="display:none">
<div class="card"><div class="toolbar"><button id="refreshBtn" type="button">刷新</button><button id="logoutBtn" type="button" class="danger">退出</button><span id="status" class="muted"></span></div></div>
<div class="card"><h2>8项筛选 / 分类管理</h2><div id="cats"></div><button id="addCatBtn" type="button">新增分类</button></div>
<div class="card"><h2>兼职发布 / 审核</h2><button id="newJobBtn" type="button">发布兼职</button><div id="jobs"></div></div>
</div>
</div>
<script>
(function () {
  "use strict";

  var G = { user: "", repo: "", token: "" };
  var categories = [];
  var jobs = [];
  var catSha = "";
  var jobSha = "";

  function $(id) {
    return document.getElementById(id);
  }

  function msg(text, type) {
    var el = $("msg");
    if (!el) return;
    el.textContent = text;
    el.className = "notice " + (type || "muted");
  }

  function stat(text, type) {
    var el = $("status");
    if (!el) return;
    el.textContent = text;
    el.className = type || "muted";
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function encode64(text) {
    return btoa(unescape(encodeURIComponent(text)));
  }

  function decode64(text) {
    var clean = String(text || "").replace(/\s/g, "");
    if (!clean) throw new Error("GitHub 返回的文件内容为空。");
    try {
      return decodeURIComponent(escape(atob(clean)));
    } catch (error) {
      throw new Error("GitHub 文件 Base64 解码失败。");
    }
  }

  function api(path, method, body) {
    if (!G.user || !G.repo || !G.token) {
      return Promise.reject(new Error("GitHub 尚未连接。"));
    }

    var options = {
      method: method || "GET",
      headers: {
        "Authorization": "Bearer " + G.token,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      }
    };

    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }

    return fetch("https://api.github.com" + path, options)
      .then(function (response) {
        return response.text().then(function (text) {
          var data = null;
          if (text) {
            try { data = JSON.parse(text); } catch (error) { data = null; }
          }
          if (!response.ok) {
            var message = data && data.message ? data.message : "HTTP " + response.status;
            if (response.status === 401) message = "401：Token 无效、过期或输入错误。";
            if (response.status === 403) message = "403：Token 没有足够权限。请给仓库 hnwdhlgk.github.io 的 Contents Read and write 权限。";
            if (response.status === 404) message = "404：仓库不存在，或 Token 无权访问。";
            if (response.status === 409) message = "409：文件版本冲突，请先点击刷新后再保存。";
            throw new Error(message);
          }
          return data;
        });
      })
      .catch(function (error) {
        if (error && error.name === "TypeError") {
          throw new Error("无法连接 GitHub API，请检查网络是否可以访问 api.github.com。");
        }
        throw error;
      });
  }

  function readFile(path) {
    var url = "/repos/" + encodeURIComponent(G.user) + "/" + encodeURIComponent(G.repo) + "/contents/" + path + "?ref=main";
    return api(url).then(function (result) {
      if (!result || !result.content) throw new Error("读取失败：" + path);
      var text = decode64(result.content);
      try {
        return { data: JSON.parse(text), sha: result.sha };
      } catch (error) {
        throw new Error("JSON 格式错误：" + path + "\n" + error.message);
      }
    });
  }

  function writeFile(path, data, sha, message) {
    if (!sha) return Promise.reject(new Error("文件 SHA 不存在，请先刷新数据。"));
    var body = {
      message: message || "更新网站数据",
      content: encode64(JSON.stringify(data, null, 2) + "\n"),
      sha: sha,
      branch: "main"
    };
    var url = "/repos/" + encodeURIComponent(G.user) + "/" + encodeURIComponent(G.repo) + "/contents/" + path;
    return api(url, "PUT", body);
  }

  function refreshData() {
    return Promise.all([readFile("data/categories.json"), readFile("data/jobs.json")])
      .then(function (result) {
        categories = Array.isArray(result[0].data) ? result[0].data : [];
        catSha = result[0].sha;
        jobs = Array.isArray(result[1].data) ? result[1].data : [];
        jobSha = result[1].sha;
        render();
      });
  }

  function doConnect() {
    var button = $("connectBtn");
    var user = $("user").value.trim();
    var repo = $("repo").value.trim();
    var token = $("token").value.trim();

    if (!user) { msg("请输入 GitHub 用户名。", "err"); return; }
    if (!repo) { msg("请输入仓库名称。", "err"); return; }
    if (!token) { msg("请输入 Fine-grained Token。", "err"); return; }

    G.user = user;
    G.repo = repo;
    G.token = token;
    button.disabled = true;
    button.textContent = "正在连接…";
    msg("① 正在验证 GitHub Token…", "wait");

    api("/user")
      .then(function () {
        msg("② Token 验证成功，正在检查仓库…", "wait");
        return api("/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo));
      })
      .then(function () {
        msg("③ 仓库访问成功，正在读取分类…", "wait");
        return readFile("data/categories.json");
      })
      .then(function (result) {
        categories = Array.isArray(result.data) ? result.data : [];
        catSha = result.sha;
        msg("④ 分类读取成功，正在读取兼职数据…", "wait");
        return readFile("data/jobs.json");
      })
      .then(function (result) {
        jobs = Array.isArray(result.data) ? result.data : [];
        jobSha = result.sha;
        try {
          sessionStorage.setItem("gh_user", user);
          sessionStorage.setItem("gh_repo", repo);
          sessionStorage.setItem("gh_token", token);
        } catch (error) {}
        render();
        $("login").style.display = "none";
        $("app").style.display = "block";
        stat("连接成功", "ok");
      })
      .catch(function (error) {
        console.error(error);
        msg("连接失败：\n\n" + (error && error.message ? error.message : String(error)), "err");
      })
      .then(function () {
        button.disabled = false;
        button.textContent = "连接";
      });
  }

  function logout() {
    try { sessionStorage.clear(); } catch (error) {}
    G = { user: "", repo: "", token: "" };
    categories = [];
    jobs = [];
    catSha = "";
    jobSha = "";
    $("token").value = "";
    $("app").style.display = "none";
    $("login").style.display = "block";
    msg("已退出，请重新输入 Token。", "muted");
  }

  function loadAll() {
    var button = $("refreshBtn");
    button.disabled = true;
    stat("正在同步…", "wait");
    refreshData()
      .then(function () { stat("数据已同步", "ok"); })
      .catch(function (error) { stat("同步失败：" + error.message, "err"); })
      .then(function () { button.disabled = false; });
  }

  function addCategory() {
    var name = prompt("分类名称");
    if (!name) return;
    var slug = prompt("Slug", "category-" + (categories.length + 1));
    if (!slug) return;
    categories.push({ slug: slug, name: name, description: "", image: "", enabled: true, sort_order: categories.length + 1 });
    var button = $("addCatBtn");
    button.disabled = true;
    stat("正在保存分类…", "wait");
    writeFile("data/categories.json", categories, catSha, "新增分类")
      .then(refreshData)
      .then(function () { stat("分类新增成功", "ok"); })
      .catch(function (error) { stat("新增失败：" + error.message, "err"); })
      .then(function () { button.disabled = false; });
  }

  function newJob() {
    var title = prompt("标题");
    if (!title) return;
    var description = prompt("描述", "") || "";
    jobs.unshift({ id: String(Date.now()), title: title, description: description, status: "approved", created_at: new Date().toISOString() });
    var button = $("newJobBtn");
    button.disabled = true;
    stat("正在发布兼职…", "wait");
    writeFile("data/jobs.json", jobs, jobSha, "发布兼职")
      .then(refreshData)
      .then(function () { stat("兼职发布成功", "ok"); })
      .catch(function (error) { stat("发布失败：" + error.message, "err"); })
      .then(function () { button.disabled = false; });
  }

  function saveCat(index) {
    var item = categories[index];
    if (!item) return;
    item.name = $("n" + index).value.trim();
    item.slug = $("s" + index).value.trim();
    item.description = $("d" + index).value;
    item.image = $("im" + index).value.trim();
    item.sort_order = Number($("o" + index).value) || index + 1;
    if (!item.name) { stat("分类名称不能为空。", "err"); return; }
    if (!item.slug) { stat("Slug 不能为空。", "err"); return; }
    stat("正在保存分类…", "wait");
    writeFile("data/categories.json", categories, catSha, "更新分类")
      .then(refreshData)
      .then(function () { stat("分类保存成功", "ok"); })
      .catch(function (error) { stat("保存失败：" + error.message, "err"); });
  }

  function deleteCategory(index) {
    var item = categories[index];
    if (!item) return;
    if (!confirm("确定删除分类“" + item.name + "”吗？")) return;
    categories.splice(index, 1);
    categories.forEach(function (category, position) { category.sort_order = position + 1; });
    stat("正在删除分类…", "wait");
    writeFile("data/categories.json", categories, catSha, "删除分类")
      .then(refreshData)
      .then(function () { stat("分类删除成功", "ok"); })
      .catch(function (error) { stat("删除失败：" + error.message, "err"); });
  }

  function render() {
    var cats = $("cats");
    if (!categories.length) {
      cats.innerHTML = '<div class="empty">暂无分类，请点击“新增分类”。</div>';
    } else {
      cats.innerHTML = categories.map(function (category, index) {
        return '<div class="item">' +
          '<div class="row">' +
          '<div>' +
          '<label>名称</label><input id="n' + index + '" value="' + esc(category.name) + '">' +
          '<label>Slug</label><input id="s' + index + '" value="' + esc(category.slug) + '">' +
          '<label>描述</label><textarea id="d' + index + '">' + esc(category.description || "") + '</textarea>' +
          '</div>' +
          '<div>' +
          '<label>图片路径</label><input id="im' + index + '" value="' + esc(category.image || "") + '">' +
          '<label>排序</label><input id="o' + index + '" type="number" value="' + (category.sort_order || index + 1) + '">' +
          '</div>' +
          '</div>' +
          '<button type="button" data-action="save-cat" data-index="' + index + '">保存</button>' +
          '<button type="button" class="danger" data-action="delete-cat" data-index="' + index + '">删除</button>' +
          '</div>';
      }).join("");
    }

    var jobsEl = $("jobs");
    if (!jobs.length) {
      jobsEl.innerHTML = '<div class="empty">暂无兼职</div>';
    } else {
      jobsEl.innerHTML = jobs.map(function (job) {
        return '<div class="item"><b>' + esc(job.title) + '</b> ' +
          '<span class="badge">' + esc(job.status || "pending") + '</span>' +
          '<p>' + esc(job.description || "") + '</p>' +
          '<div class="muted">ID：' + esc(job.id || "") + '</div></div>';
      }).join("");
    }
  }

  function restoreLogin() {
    try {
      var user = sessionStorage.getItem("gh_user");
      var repo = sessionStorage.getItem("gh_repo");
      var token = sessionStorage.getItem("gh_token");
      if (user && repo && token) {
        $("user").value = user;
        $("repo").value = repo;
        $("token").value = token;
        msg("正在验证上次登录信息…", "wait");
        doConnect();
        return;
      }
    } catch (error) {}
    msg("后台脚本已加载，请输入 Token 后点击“连接”。", "muted");
  }

  function bindEvents() {
    $("connectBtn").addEventListener("click", doConnect);
    $("clearBtn").addEventListener("click", function () {
      try { sessionStorage.clear(); } catch (error) {}
      $("token").value = "";
      msg("已清除登录信息。", "muted");
    });
    $("refreshBtn").addEventListener("click", loadAll);
    $("logoutBtn").addEventListener("click", logout);
    $("addCatBtn").addEventListener("click", addCategory);
    $("newJobBtn").addEventListener("click", newJob);
    $("cats").addEventListener("click", function (event) {
      var button = event.target.closest("button[data-action]");
      if (!button) return;
      var index = Number(button.getAttribute("data-index"));
      if (button.getAttribute("data-action") === "save-cat") saveCat(index);
      if (button.getAttribute("data-action") === "delete-cat") deleteCategory(index);
    });
  }

  window.addEventListener("error", function (event) {
    console.error("页面脚本错误：", event.error || event.message);
  });

  window.addEventListener("DOMContentLoaded", function () {
    bindEvents();
    restoreLogin();
  });
})();
</script>
</body>
</html>
