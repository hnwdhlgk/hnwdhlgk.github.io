<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>网站管理后台</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f7fb;
  color:#183b60;
  font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  background:#0d47a1;
  color:#fff;
  padding:11px 18px;
  border-radius:9px;
  cursor:pointer;
  margin:3px;
  font-size:15px;
  transition:.15s;
}

button:hover{
  filter:brightness(.92);
}

button:active{
  transform:translateY(1px);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.danger{
  background:#b3261e;
}

.secondary{
  background:#607d8b;
}

.success{
  background:#137333;
}

.wrap{
  width:min(1080px,94%);
  margin:25px auto;
}

.card{
  background:#fff;
  border:1px solid #dfe7ef;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(24,59,96,.04);
}

h1{
  margin:0 0 18px;
}

h2{
  margin-top:0;
}

.muted{
  color:#71859a;
  font-size:13px;
}

.ok{
  color:#137333;
}

.err{
  color:#b3261e;
}

.wait{
  color:#8a5a00;
}

.notice{
  padding:12px;
  border-radius:9px;
  background:#f6f8fa;
  margin-top:10px;
  white-space:pre-wrap;
  line-height:1.6;
  word-break:break-word;
}

.notice.ok{
  background:#edf7ed;
}

.notice.err{
  background:#fff1f0;
}

.notice.wait{
  background:#fff8e1;
}

label{
  display:block;
  margin-top:8px;
  font-weight:600;
}

input,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d6e2ed;
  border-radius:9px;
  margin:6px 0 12px;
  background:#fff;
  color:#183b60;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#0d47a1;
  box-shadow:0 0 0 3px rgba(13,71,161,.08);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.item{
  border-top:1px solid #edf2f6;
  padding:15px 0;
}

.item:first-child{
  border-top:0;
}

.toolbar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
}

.toolbar .status{
  margin-left:8px;
}

.empty{
  padding:20px;
  text-align:center;
  color:#71859a;
  background:#f8fafc;
  border-radius:10px;
}

.small{
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:20px;
  background:#edf2f7;
  color:#607d8b;
  font-size:12px;
  margin-left:5px;
}

.badge.ok{
  background:#e8f5e9;
  color:#137333;
}

.badge.pending{
  background:#fff8e1;
  color:#8a5a00;
}

.badge.rejected{
  background:#ffebee;
  color:#b3261e;
}

hr{
  border:0;
  border-top:1px solid #edf2f6;
  margin:18px 0;
}

@media(max-width:700px){

  .wrap{
    width:94%;
    margin:15px auto;
  }

  .card{
    padding:15px;
    border-radius:13px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:19px;
  }

  .row{
    grid-template-columns:1fr;
    gap:0;
  }

  button{
    padding:10px 14px;
  }

  .toolbar{
    align-items:stretch;
  }

  .toolbar button{
    flex:1;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>网站管理后台</h1>

  <!-- 登录 -->
  <div id="login" class="card">

    <h2>GitHub 授权</h2>

    <p class="muted">
      纯 GitHub 无服务器后台。Token 只保存在当前浏览器会话。
    </p>

    <label for="user">GitHub 用户名</label>
    <input
      id="user"
      value="hnwdhlgk"
      autocomplete="username"
      placeholder="例如：hnwdhlgk"
    >

    <label for="repo">仓库</label>
    <input
      id="repo"
      value="hnwdhlgk.github.io"
      autocomplete="off"
      placeholder="例如：hnwdhlgk.github.io"
    >

    <label for="token">Fine-grained Token</label>
    <input
      id="token"
      type="password"
      placeholder="github_pat_..."
      autocomplete="off"
    >

    <button
      id="connectBtn"
      type="button"
      onclick="connectGithub()"
    >
      连接
    </button>

    <button
      id="clearTokenBtn"
      type="button"
      class="secondary"
      onclick="clearSavedLogin()"
    >
      清除登录信息
    </button>

    <div
      id="msg"
      class="notice muted"
    >
      后台脚本正在加载…
    </div>

  </div>


  <!-- 后台 -->
  <div
    id="app"
    style="display:none"
  >

    <!-- 顶部 -->
    <div class="card">

      <div class="toolbar">

        <button
          type="button"
          onclick="loadAll()"
          id="refreshBtn"
        >
          刷新
        </button>

        <button
          type="button"
          class="danger"
          onclick="logoutGithub()"
        >
          退出
        </button>

        <span
          id="status"
          class="status muted"
        >
          已连接
        </span>

      </div>

    </div>


    <!-- 分类 -->
    <div class="card">

      <h2>8项筛选 / 分类管理</h2>

      <div
        id="cats"
      ></div>

      <button
        type="button"
        onclick="addCategory()"
        id="addCategoryBtn"
      >
        新增分类
      </button>

    </div>


    <!-- 兼职 -->
    <div class="card">

      <h2>兼职发布 / 审核</h2>

      <button
        type="button"
        onclick="newJob()"
        id="newJobBtn"
      >
        发布兼职
      </button>

      <div
        id="jobs"
      ></div>

    </div>

  </div>

</div>


<script>
(function(){

"use strict";

/* =========================
   全局数据
========================= */

var G = {
  user: "",
  repo: "",
  token: ""
};

var categories = [];
var jobs = [];

var catSha = "";
var jobSha = "";


/* =========================
   DOM
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
   页面消息
========================= */

function msg(text, type){

  var el = $("msg");

  if(!el){
    return;
  }

  el.innerText = text || "";

  el.className = "notice " + (
    type || "muted"
  );
}


function stat(text, type){

  var el = $("status");

  if(!el){
    return;
  }

  el.innerText = text || "";

  el.className = "status " + (
    type || "muted"
  );
}


/* =========================
   HTML 转义
========================= */

function esc(value){

  var s = String(
    value == null ? "" : value
  );

  return s
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


/* =========================
   UTF-8 Base64 编码
========================= */

function encodeBase64(text){

  return btoa(
    unescape(
      encodeURIComponent(text)
    )
  );
}


/* =========================
   UTF-8 Base64 解码
========================= */

function decodeBase64(base64){

  try{

    var clean = String(base64 || "")
      .replace(/\s/g,"");

    if(!clean){
      throw new Error("GitHub 返回的文件内容为空。");
    }

    return decodeURIComponent(
      escape(
        atob(clean)
      )
    );

  }catch(e){

    throw new Error(
      "文件内容解码失败：" +
      (e.message || e)
    );

  }

}


/* =========================
   GitHub API
========================= */

function api(path, method, body){

  if(!G.user || !G.repo || !G.token){

    return Promise.reject(
      new Error("GitHub 尚未连接。")
    );

  }

  var options = {

    method: method || "GET",

    headers: {

      "Authorization":
        "Bearer " + G.token,

      "Accept":
        "application/vnd.github+json",

      "X-GitHub-Api-Version":
        "2022-11-28"

    }

  };


  if(body !== undefined){

    options.headers[
      "Content-Type"
    ] = "application/json";

    options.body = JSON.stringify(body);

  }


  return fetch(
    "https://api.github.com" + path,
    options
  )

  .then(function(response){

    return response.text()

      .then(function(text){

        var data = null;

        if(text){

          try{
            data = JSON.parse(text);
          }catch(e){
            data = null;
          }

        }


        if(!response.ok){

          var errorMessage =
            data && data.message
              ? data.message
              : "HTTP " + response.status;


          if(response.status === 401){

            errorMessage =
              "401：GitHub Token 无效、过期或输入错误。";

          }

          else if(response.status === 403){

            errorMessage =
              "403：GitHub 拒绝访问。\n\n" +
              "请确认 Fine-grained Token 已授权该仓库，并开启：\n" +
              "Repository permissions → Contents → Read and write";

          }

          else if(response.status === 404){

            errorMessage =
              "404：仓库不存在，或者 Token 没有权限访问该仓库。\n\n" +
              "当前仓库：\n" +
              G.user + "/" + G.repo;

          }

          else if(response.status === 409){

            errorMessage =
              "409：GitHub 文件版本冲突，请先刷新后台后再保存。";

          }

          else if(response.status === 422){

            errorMessage =
              "422：GitHub 请求参数错误。\n\n" +
              (data && data.message
                ? data.message
                : "");

          }


          throw new Error(errorMessage);

        }


        return data;

      });

  })

  .catch(function(error){

    if(
      error &&
      error.name === "TypeError"
    ){

      throw new Error(
        "无法连接 GitHub API。\n\n" +
        "请检查：\n" +
        "1. 当前网络是否正常\n" +
        "2. 浏览器是否拦截 GitHub API\n" +
        "3. 是否可以打开 api.github.com"
      );

    }

    throw error;

  });

}


/* =========================
   读取 GitHub 文件
========================= */

function readFile(path){

  var safeUser =
    encodeURIComponent(G.user);

  var safeRepo =
    encodeURIComponent(G.repo);

  var safePath =
    path
      .split("/")
      .map(function(part){
        return encodeURIComponent(part);
      })
      .join("/");


  return api(
    "/repos/" +
    safeUser +
    "/" +
    safeRepo +
    "/contents/" +
    safePath +
    "?ref=main"
  )

  .then(function(result){

    if(!result){

      throw new Error(
        "GitHub 没有返回文件数据：" +
        path
      );

    }


    if(!result.content){

      throw new Error(
        "读取文件失败：\n" +
        path +
        "\n\nGitHub 没有返回 content。"
      );

    }


    var text =
      decodeBase64(result.content);


    if(!text.trim()){

      throw new Error(
        "文件为空：\n" +
        path
      );

    }


    var data;

    try{

      data = JSON.parse(text);

    }catch(e){

      throw new Error(
        "JSON 文件格式错误：\n" +
        path +
        "\n\n" +
        (e.message || e) +
        "\n\n文件开头内容：\n" +
        text.substring(0,300)
      );

    }


    return {

      data: data,

      sha: result.sha

    };

  });

}


/* =========================
   写入 GitHub 文件
========================= */

function writeFile(
  path,
  data,
  sha,
  message
){

  if(!sha){

    return Promise.reject(
      new Error(
        "缺少文件 SHA，请先点击“刷新”。"
      )
    );

  }


  var text =
    JSON.stringify(
      data,
      null,
      2
    ) + "\n";


  return api(
    "/repos/" +
    encodeURIComponent(G.user) +
    "/" +
    encodeURIComponent(G.repo) +
    "/contents/" +
    path,

    "PUT",

    {

      message:
        message || "更新网站数据",

      content:
        encodeBase64(text),

      sha:
        sha,

      branch:
        "main"

    }

  );

}


/* =========================
   保存登录
========================= */

function saveLogin(){

  try{

    sessionStorage.setItem(
      "gh_user",
      G.user
    );

    sessionStorage.setItem(
      "gh_repo",
      G.repo
    );

    sessionStorage.setItem(
      "gh_token",
      G.token
    );

  }catch(e){

    console.warn(
      "sessionStorage 不可用",
      e
    );

  }

}


/* =========================
   恢复登录
========================= */

function restoreLogin(){

  try{

    var user =
      sessionStorage.getItem("gh_user");

    var repo =
      sessionStorage.getItem("gh_repo");

    var token =
      sessionStorage.getItem("gh_token");


    if(
      user &&
      repo &&
      token
    ){

      $("user").value = user;
      $("repo").value = repo;
      $("token").value = token;

      msg(
        "检测到上次登录信息，正在验证 GitHub 连接…",
        "wait"
      );

      connectGithub(true);

      return;

    }

  }catch(e){

    console.warn(
      "恢复登录失败",
      e
    );

  }


  msg(
    "后台脚本已加载，请输入 Token 后点击“连接”。",
    "muted"
  );

}


/* =========================
   清除登录
========================= */

window.clearSavedLogin =
function(){

  try{

    sessionStorage.removeItem("gh_user");
    sessionStorage.removeItem("gh_repo");
    sessionStorage.removeItem("gh_token");

  }catch(e){}


  $("token").value = "";

  msg(
    "已清除保存的登录信息。",
    "muted"
  );

};


/* =========================
   GitHub 连接
========================= */

window.connectGithub =
function(auto){

  var button =
    $("connectBtn");


  var user =
    $("user").value.trim();

  var repo =
    $("repo").value.trim();

  var token =
    $("token").value.trim();


  if(!user){

    msg(
      "请输入 GitHub 用户名。",
      "err"
    );

    return;

  }


  if(!repo){

    msg(
      "请输入仓库名称。",
      "err"
    );

    return;

  }


  if(!token){

    msg(
      "请输入 Fine-grained Token。",
      "err"
    );

    return;

  }


  G = {

    user:user,

    repo:repo,

    token:token

  };


  button.disabled = true;

  button.innerText =
    "正在连接…";


  msg(
    auto
      ? "正在验证保存的 GitHub 登录信息…"
      : "正在连接 GitHub，请稍候…",
    "wait"
  );


  /*
    第一步：
    验证 Token
  */

  api("/user")

  .then(function(){

    msg(
      "Token 验证成功，正在检查仓库…",
      "wait"
    );


    /*
      第二步：
      检查仓库
    */

    return api(
      "/repos/" +
      encodeURIComponent(user) +
      "/" +
      encodeURIComponent(repo)
    );

  })

  .then(function(){

    msg(
      "仓库访问成功，正在读取分类数据…",
      "wait"
    );


    /*
      第三步：
      categories.json
    */

    return readFile(
      "data/categories.json"
    );

  })

  .then(function(result){

    categories =
      Array.isArray(result.data)
        ? result.data
        : [];


    catSha =
      result.sha;


    msg(
      "分类数据读取成功，正在读取兼职数据…",
      "wait"
    );


    /*
      第四步：
      jobs.json
    */

    return readFile(
      "data/jobs.json"
    );

  })

  .then(function(result){

    jobs =
      Array.isArray(result.data)
        ? result.data
        : [];


    jobSha =
      result.sha;


    saveLogin();


    $("login").style.display =
      "none";

    $("app").style.display =
      "block";


    render();


    stat(
      "GitHub 连接成功",
      "ok"
    );

  })

  .catch(function(error){

    console.error(
      "GitHub 连接失败：",
      error
    );


    msg(
      "连接失败：\n\n" +
      (
        error && error.message
          ? error.message
          : error
      ),
      "err"
    );

  })

  .finally(function(){

    button.disabled =
      false;

    button.innerText =
      "连接";

  });

};


/* =========================
   刷新全部数据
========================= */

window.loadAll =
function(){

  var button =
    $("refreshBtn");


  button.disabled =
    true;


  stat(
    "正在同步 GitHub 数据…",
    "wait"
  );


  Promise.all([

    readFile(
      "data/categories.json"
    ),

    readFile(
      "data/jobs.json"
    )

  ])

  .then(function(result){

    categories =
      Array.isArray(result[0].data)
        ? result[0].data
        : [];


    catSha =
      result[0].sha;


    jobs =
      Array.isArray(result[1].data)
        ? result[1].data
        : [];


    jobSha =
      result[1].sha;


    render();


    stat(
      "数据已同步",
      "ok"
    );

  })

  .catch(function(error){

    console.error(
      "同步失败：",
      error
    );


    stat(
      "同步失败：" +
      (
        error.message ||
        error
      ),
      "err"
    );

  })

  .finally(function(){

    button.disabled =
      false;

  });

};


/* =========================
   退出
========================= */

window.logoutGithub =
function(){

  try{

    sessionStorage.removeItem(
      "gh_user"
    );

    sessionStorage.removeItem(
      "gh_repo"
    );

    sessionStorage.removeItem(
      "gh_token"
    );

  }catch(e){}


  G = {
    user:"",
    repo:"",
    token:""
  };


  categories = [];
  jobs = [];

  catSha = "";
  jobSha = "";


  $("token").value = "";

  $("app").style.display =
    "none";

  $("login").style.display =
    "block";


  msg(
    "已退出，请重新输入 Token。",
    "muted"
  );

};


/* =========================
   新增分类
========================= */

window.addCategory =
function(){

  var name =
    prompt(
      "请输入分类名称"
    );


  if(!name){
    return;
  }


  var slug =
    prompt(
      "请输入 Slug",
      "category-" +
      (categories.length + 1)
    );


  if(!slug){
    return;
  }


  categories.push({

    slug:slug,

    name:name,

    description:"",

    image:"",

    enabled:true,

    sort_order:
      categories.length + 1

  });


  stat(
    "正在保存新分类…",
    "wait"
  );


  var button =
    $("addCategoryBtn");


  button.disabled =
    true;


  writeFile(

    "data/categories.json",

    categories,

    catSha,

    "新增分类"

  )

  .then(function(){

    return loadAll();

  })

  .catch(function(error){

    stat(
      "新增失败：" +
      error.message,
      "err"
    );

  })

  .finally(function(){

    button.disabled =
      false;

  });

};


/* =========================
   发布兼职
========================= */

window.newJob =
function(){

  var title =
    prompt(
      "请输入兼职标题"
    );


  if(!title){
    return;
  }


  var description =
    prompt(
      "请输入兼职描述",
      ""
    ) || "";


  var job = {

    id:
      String(
        Date.now()
      ),

    title:
      title,

    description:
      description,

    status:
      "approved",

    created_at:
      new Date().toISOString()

  };


  jobs.unshift(job);


  stat(
    "正在发布兼职…",
    "wait"
  );


  var button =
    $("newJobBtn");


  button.disabled =
    true;


  writeFile(

    "data/jobs.json",

    jobs,

    jobSha,

    "发布兼职"

  )

  .then(function(){

    return loadAll();

  })

  .catch(function(error){

    stat(
      "发布失败：" +
      error.message,
      "err"
    );

  })

  .finally(function(){

    button.disabled =
      false;

  });

};


/* =========================
   保存分类
========================= */

window.saveCat =
function(i){

  var c =
    categories[i];


  if(!c){

    stat(
      "分类不存在。",
      "err"
    );

    return;

  }


  var name =
    $("n" + i).value.trim();

  var slug =
    $("s" + i).value.trim();

  var description =
    $("d" + i).value;

  var image =
    $("im" + i).value.trim();

  var sort =
    Number(
      $("o" + i).value
    ) || i + 1;


  if(!name){

    stat(
      "分类名称不能为空。",
      "err"
    );

    return;

  }


  if(!slug){

    stat(
      "Slug 不能为空。",
      "err"
    );

    return;

  }


  c.name =
    name;

  c.slug =
    slug;

  c.description =
    description;

  c.image =
    image;

  c.sort_order =
    sort;


  stat(
    "正在保存分类…",
    "wait"
  );


  var buttons =
    document.querySelectorAll(
      "#cats button"
    );


  if(buttons[i]){

    buttons[i].disabled =
      true;

  }


  writeFile(

    "data/categories.json",

    categories,

    catSha,

    "更新分类"

  )

  .then(function(){

    return loadAll();

  })

  .catch(function(error){

    stat(
      "保存失败：" +
      error.message,
      "err"
    );

  })

  .finally(function(){

    buttons =
      document.querySelectorAll(
        "#cats button"
      );

    if(buttons[i]){
      buttons[i].disabled =
        false;
    }

  });

};


/* =========================
   删除分类
========================= */

window.deleteCategory =
function(i){

  var c =
    categories[i];


  if(!c){
    return;
  }


  if(
    !confirm(
      "确定删除分类“" +
      c.name +
      "”吗？"
    )
  ){

    return;

  }


  categories.splice(
    i,
    1
  );


  categories.forEach(
    function(item,index){

      item.sort_order =
        index + 1;

    }
  );


  stat(
    "正在删除分类…",
    "wait"
  );


  writeFile(

    "data/categories.json",

    categories,

    catSha,

    "删除分类"

  )

  .then(function(){

    return loadAll();

  })

  .catch(function(error){

    stat(
      "删除失败：" +
      error.message,
      "err"
    );

  });

};


/* =========================
   渲染页面
========================= */

window.render =
function(){

  var cats =
    $("cats");


  if(!categories.length){

    cats.innerHTML =
      '<div class="empty">' +
      '暂无分类，请点击“新增分类”。' +
      '</div>';

  }else{

    cats.innerHTML =
      categories.map(
        function(c,i){

          return (

            '<div class="item">' +

              '<div class="row">' +

                '<div>' +

                  '<label>名称</label>' +

                  '<input ' +
                    'id="n' + i + '" ' +
                    'value="' +
                    esc(c.name) +
                    '"' +
                  '>' +

                  '<label>Slug</label>' +

                  '<input ' +
                    'id="s' + i + '" ' +
                    'value="' +
                    esc(c.slug) +
                    '"' +
                  '>' +

                  '<label>描述</label>' +

                  '<textarea ' +
                    'id="d' + i + '">' +
                    esc(
                      c.description || ""
                    ) +
                  '</textarea>' +

                '</div>' +

                '<div>' +

                  '<label>图片路径</label>' +

                  '<input ' +
                    'id="im' + i + '" ' +
                    'value="' +
                    esc(
                      c.image || ""
                    ) +
                    '"' +
                  '>' +

                  '<label>排序</label>' +

                  '<input ' +
                    'id="o' + i + '" ' +
                    'type="number" ' +
                    'value="' +
                    (
                      c.sort_order ||
                      i + 1
                    ) +
                    '"' +
                  '>' +

                  '<label>状态</label>' +

                  '<div>' +

                    '<span class="badge ' +
                    (
                      c.enabled === false
                        ? ""
                        : "ok"
                    ) +
                    '">' +

                    (
                      c.enabled === false
                        ? "关闭"
                        : "启用"
                    ) +

                    '</span>' +

                  '</div>' +

                '</div>' +

              '</div>' +

              '<button ' +
                'type="button" ' +
                'onclick="saveCat(' +
                i +
                ')"' +
              '>' +
                '保存' +
              '</button>' +

              '<button ' +
                'type="button" ' +
                'class="danger" ' +
                'onclick="deleteCategory(' +
                i +
                ')"' +
              '>' +
                '删除' +
              '</button>' +

            '</div>'

          );

        }
      ).join("");

  }


  var jobsEl =
    $("jobs");


  if(!jobs.length){

    jobsEl.innerHTML =
      '<div class="empty">' +
      '暂无兼职' +
      '</div>';

  }else{

    jobsEl.innerHTML =
      jobs.map(
        function(j){

          var status =
            j.status ||
            "pending";


          var badgeClass =
            status === "approved"
              ? "ok"
              : status === "rejected"
                ? "rejected"
                : "pending";


          return (

            '<div class="item">' +

              '<b>' +
                esc(j.title) +
              '</b>' +

              '<span class="badge ' +
                badgeClass +
              '">' +
                esc(status) +
              '</span>' +

              '<p>' +
                esc(
                  j.description || ""
                ) +
              '</p>' +

              '<div class="muted small">' +
                'ID：' +
                esc(j.id || "") +
                '<br>' +
                '发布时间：' +
                esc(j.created_at || "") +
              '</div>' +

            '</div>'

          );

        }
      ).join("");

  }

};

            event.message ||

        );

  }
);
