<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网站管理后台</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f7fb;
  color:#183b60;
  font-family:Arial,"Microsoft YaHei",sans-serif
}
.wrap{
  width:min(1080px,94%);
  margin:25px auto
}
.card{
  background:#fff;
  border:1px solid #dfe7ef;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px
}
h1{margin-top:0}
.muted{color:#71859a;font-size:13px}
.ok{color:#137333}
.err{color:#b3261e}
.wait{color:#8a5a00}
.notice{
  padding:12px;
  border-radius:9px;
  background:#f6f8fa;
  margin-top:10px;
  white-space:pre-wrap;
  line-height:1.6
}
label{
  display:block;
  margin-top:8px
}
input,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d6e2ed;
  border-radius:9px;
  margin:6px 0 12px;
  font:inherit
}
textarea{
  min-height:90px;
  resize:vertical
}
button{
  border:0;
  background:#0d47a1;
  color:#fff;
  padding:11px 18px;
  border-radius:9px;
  cursor:pointer;
  margin:3px;
  font-size:15px
}
button:hover{filter:brightness(.92)}
button:disabled{
  opacity:.55;
  cursor:not-allowed
}
.danger{background:#b3261e}
.gray{background:#607d8b}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.item{
  border-top:1px solid #edf2f6;
  padding:15px 0
}
.toolbar{
  display:flex;
  align-items:center;
  flex-wrap:wrap
}
.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:20px;
  background:#edf2f7;
  font-size:12px
}
.empty{
  padding:18px;
  text-align:center;
  color:#71859a;
  background:#f8fafc;
  border-radius:9px
}
@media(max-width:700px){
  .wrap{width:94%;margin:15px auto}
  .card{padding:15px}
  .row{grid-template-columns:1fr}
  h1{font-size:24px}
  button{padding:10px 14px}
}
</style>
</head>

<body>

<div class="wrap">

<h1>网站管理后台</h1>

<div id="login" class="card">

<h2>GitHub 授权</h2>

<p class="muted">
纯 GitHub 无服务器后台。Token 只保存在当前浏览器会话。
</p>

<label>GitHub 用户名</label>
<input id="user" value="hnwdhlgk" autocomplete="username">

<label>仓库</label>
<input id="repo" value="hnwdhlgk.github.io">

<label>Fine-grained Token</label>
<input id="token" type="password" placeholder="github_pat_..." autocomplete="off">

<button id="connectBtn" type="button" onclick="connect()">
连接
</button>

<button type="button" class="gray" onclick="clearLogin()">
清除登录信息
</button>

<div id="msg" class="notice muted">
后台脚本正在加载…
</div>

</div>


<div id="app" style="display:none">

<div class="card">

<div class="toolbar">

<button id="refreshBtn" type="button" onclick="loadAll()">
刷新
</button>

<button type="button" class="danger" onclick="logout()">
退出
</button>

<span id="status" class="muted">
等待操作
</span>

</div>

</div>


<div class="card">

<h2>8项筛选 / 分类管理</h2>

<div id="cats"></div>

<button id="addCatBtn" type="button" onclick="addCategory()">
新增分类
</button>

</div>


<div class="card">

<h2>兼职发布 / 审核</h2>

<button id="newJobBtn" type="button" onclick="newJob()">
发布兼职
</button>

<div id="jobs"></div>

</div>

</div>

</div>


<script>
(function(){

"use strict";


/* =========================
   全局变量
========================= */

var G = {
  user:"",
  repo:"",
  token:""
};

var categories = [];
var jobs = [];

var catSha = "";
var jobSha = "";


/* =========================
   DOM
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
   消息
========================= */

function showMsg(text,type){

  var el = $("msg");

  if(!el){
    return;
  }

  el.innerText = text;
  el.className = "notice " + (type || "muted");
}


function showStatus(text,type){

  var el = $("status");

  if(!el){
    return;
  }

  el.innerText = text;
  el.className = type || "muted";
}


/* =========================
   HTML 转义
========================= */

function esc(value){

  var s = String(
    value == null ? "" : value
  );

  return s
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


/* =========================
   Base64 UTF-8 编码
========================= */

function encode64(text){

  return btoa(
    unescape(
      encodeURIComponent(text)
    )
  );
}


/* =========================
   Base64 UTF-8 解码
========================= */

function decode64(text){

  var clean = String(text || "")
    .replace(/\s/g,"");

  if(!clean){
    throw new Error("GitHub 返回的文件内容为空。");
  }

  try{

    return decodeURIComponent(
      escape(
        atob(clean)
      )
    );

  }catch(e){

    throw new Error(
      "GitHub 文件 Base64 解码失败。"
    );

  }
}


/* =========================
   GitHub API
========================= */

function api(path,method,body){

  if(!G.user || !G.repo || !G.token){

    return Promise.reject(
      new Error("GitHub 尚未连接。")
    );

  }

  var options = {
    method:method || "GET",
    headers:{
      "Authorization":"Bearer " + G.token,
      "Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28"
    }
  };


  if(body !== undefined){

    options.headers["Content-Type"] =
      "application/json";

    options.body =
      JSON.stringify(body);

  }


  return fetch(
    "https://api.github.com" + path,
    options
  )

  .then(function(response){

    return response.text()
      .then(function(text){

        var data = null;

        if(text){

          try{
            data = JSON.parse(text);
          }catch(e){
            data = null;
          }

        }


        if(!response.ok){

          var message =
            data && data.message
              ? data.message
              : "HTTP " + response.status;


          if(response.status === 401){

            message =
              "401：Token 无效、过期或输入错误。";

          }else if(response.status === 403){

            message =
              "403：Token 没有足够权限。\n\n" +
              "请在 GitHub Fine-grained Token 中确认：\n" +
              "Repository access → 选择 hnwdhlgk.github.io\n" +
              "Permissions → Contents → Read and write";

          }else if(response.status === 404){

            message =
              "404：仓库不存在，或 Token 无权访问。\n\n" +
              "当前仓库：\n" +
              G.user + "/" + G.repo;

          }else if(response.status === 409){

            message =
              "409：文件版本发生冲突，请先点击刷新。";

          }


          throw new Error(message);

        }


        return data;

      });

  })

  .catch(function(error){

    if(
      error &&
      error.name === "TypeError"
    ){

      throw new Error(
        "无法连接 GitHub API。\n\n" +
        "请检查当前网络以及浏览器是否可以访问 api.github.com。"
      );

    }

    throw error;

  });

}


/* =========================
   读取 JSON
========================= */

function readFile(path){

  var url =
    "/repos/" +
    encodeURIComponent(G.user) +
    "/" +
    encodeURIComponent(G.repo) +
    "/contents/" +
    path +
    "?ref=main";


  return api(url)

    .then(function(result){

      if(!result){

        throw new Error(
          "GitHub 没有返回数据：" + path
        );

      }


      if(!result.content){

        throw new Error(
          "读取失败：" +
          path +
          "\nGitHub 没有返回文件 content。"
        );

      }


      var text =
        decode64(result.content);


      try{

        return {
          data:JSON.parse(text),
          sha:result.sha
        };

      }catch(e){

        throw new Error(
          "JSON 格式错误：\n" +
          path +
          "\n\n" +
          e.message
        );

      }

    });

}


/* =========================
   保存 JSON
========================= */

function writeFile(path,data,sha,message){

  if(!sha){

    return Promise.reject(
      new Error(
        "文件 SHA 不存在，请先刷新数据。"
      )
    );

  }


  var content =
    JSON.stringify(
      data,
      null,
      2
    ) + "\n";


  var body = {

    message:message || "更新网站数据",

    content:encode64(content),

    sha:sha,

    branch:"main"

  };


  var url =
    "/repos/" +
    encodeURIComponent(G.user) +
    "/" +
    encodeURIComponent(G.repo) +
    "/contents/" +
    path;


  return api(
    url,
    "PUT",
    body
  );

}


/* =========================
   连接 GitHub
========================= */

function doConnect(){

  var button =
    $("connectBtn");


  var user =
    $("user").value.trim();

  var repo =
    $("repo").value.trim();

  var token =
    $("token").value.trim();


  if(!user){

    showMsg(
      "请输入 GitHub 用户名。",
      "err"
    );

    return;

  }


  if(!repo){

    showMsg(
      "请输入仓库名称。",
      "err"
    );

    return;

  }


  if(!token){

    showMsg(
      "请输入 Fine-grained Token。",
      "err"
    );

    return;

  }


  G.user = user;
  G.repo = repo;
  G.token = token;


  button.disabled = true;
  button.innerText = "正在连接…";


  showMsg(
    "① 正在验证 GitHub Token…",
    "wait"
  );


  api("/user")

  .then(function(){

    showMsg(
      "② Token 验证成功，正在检查仓库…",
      "wait"
    );


    return api(
      "/repos/" +
      encodeURIComponent(user) +
      "/" +
      encodeURIComponent(repo)
    );

  })

  .then(function(){

    showMsg(
      "③ 仓库访问成功，正在读取分类…",
      "wait"
    );


    return readFile(
      "data/categories.json"
    );

  })

  .then(function(result){

    categories =
      Array.isArray(result.data)
        ? result.data
        : [];

    catSha =
      result.sha;


    showMsg(
      "④ 分类读取成功，正在读取兼职数据…",
      "wait"
    );


    return readFile(
      "data/jobs.json"
    );

  })

  .then(function(result){

    jobs =
      Array.isArray(result.data)
        ? result.data
        : [];

    jobSha =
      result.sha;


    try{

      sessionStorage.setItem(
        "gh_user",
        user
      );

      sessionStorage.setItem(
        "gh_repo",
        repo
      );

      sessionStorage.setItem(
        "gh_token",
        token
      );

    }catch(e){}


    render();


    $("login").style.display =
      "none";

    $("app").style.display =
      "block";


    showStatus(
      "连接成功",
      "ok"
    );

  })

  .catch(function(error){

    console.error(
      "GitHub Error:",
      error
    );


    showMsg(
      "连接失败：\n\n" +
      (
        error && error.message
          ? error.message
          : String(error)
      ),
      "err"
    );

  })

  .finally(function(){

    button.disabled = false;
    button.innerText = "连接";

  });

}


/* =========================
   兼容旧代码
========================= */

window.connect = function(){

  doConnect();

};


window.connectGithub = function(){

  doConnect();

};


/* =========================
   自动恢复
========================= */

function restoreLogin(){

  try{

    var user =
      sessionStorage.getItem("gh_user");

    var repo =
      sessionStorage.getItem("gh_repo");

    var token =
      sessionStorage.getItem("gh_token");


    if(
      user &&
      repo &&
      token
    ){

      $("user").value = user;
      $("repo").value = repo;
      $("token").value = token;

      showMsg(
        "正在验证上次登录信息…",
        "wait"
      );

      doConnect();

      return;

    }

  }catch(e){}


  showMsg(
    "后台脚本已加载，请输入 Token 后点击“连接”。",
    "muted"
  );

}


/* =========================
   清除登录
========================= */

window.clearLogin = function(){

  try{

    sessionStorage.removeItem("gh_user");
    sessionStorage.removeItem("gh_repo");
    sessionStorage.removeItem("gh_token");

  }catch(e){}


  $("token").value = "";

  showMsg(
    "已清除登录信息。",
    "muted"
  );

};


/* =========================
   刷新
========================= */

window.loadAll = function(){

  var button =
    $("refreshBtn");

  button.disabled = true;


  showStatus(
    "正在同步…",
    "wait"
  );


  Promise.all([

    readFile("data/categories.json"),

    readFile("data/jobs.json")

  ])

  .then(function(result){

    categories =
      Array.isArray(result[0].data)
        ? result[0].data
        : [];

    catSha =
      result[0].sha;


    jobs =
      Array.isArray(result[1].data)
        ? result[1].data
        : [];

    jobSha =
      result[1].sha;


    render();


    showStatus(
      "数据已同步",
      "ok"
    );

  })

  .catch(function(error){

    showStatus(
      "同步失败：" +
      error.message,
      "err"
    );

  })

  .finally(function(){

    button.disabled = false;

  });

};


/* =========================
   退出
========================= */

window.logout = function(){

  try{

    sessionStorage.clear();

  }catch(e){}


  G = {
    user:"",
    repo:"",
    token:""
  };

  categories = [];
  jobs = [];

  catSha = "";
  jobSha = "";


  $("token").value = "";

  $("app").style.display =
    "none";

  $("login").style.display =
    "block";


  showMsg(
    "已退出，请重新输入 Token。",
    "muted"
  );

};


/* =========================
   新增分类
========================= */

window.addCategory = function(){

  var name =
    prompt("分类名称");

  if(!name){
    return;
  }


  var slug =
    prompt(
      "Slug",
      "category-" +
      (categories.length + 1)
    );

  if(!slug){
    return;
  }


  categories.push({

    slug:slug,

    name:name,

    description:"",

    image:"",

    enabled:true,

    sort_order:
      categories.length + 1

  });


  var button =
    $("addCatBtn");

  button.disabled = true;


  showStatus(
    "正在保存分类…",
    "wait"
  );


  writeFile(
    "data/categories.json",
    categories,
    catSha,
    "新增分类"
  )

  .then(function(){

    return refreshData();

  })

  .catch(function(error){

    showStatus(
      "新增失败：" +
      error.message,
      "err"
    );

  })

  .finally(function(){

    button.disabled = false;

  });

};


/* =========================
   发布兼职
========================= */

window.newJob = function(){

  var title =
    prompt("标题");

  if(!title){
    return;
  }


  var description =
    prompt("描述","") || "";


  jobs.unshift({

    id:String(Date.now()),

    title:title,

    description:description,

    status:"approved",

    created_at:
      new Date().toISOString()

  });


  var button =
    $("newJobBtn");

  button.disabled = true;


  showStatus(
    "正在发布兼职…",
    "wait"
  );


  writeFile(
    "data/jobs.json",
    jobs,
    jobSha,
    "发布兼职"
  )

  .then(function(){

    return refreshData();

  })

  .catch(function(error){

    showStatus(
      "发布失败：" +
      error.message,
      "err"
    );

  })

  .finally(function(){

    button.disabled = false;

  });

};


/* =========================
   保存分类
========================= */

window.saveCat = function(i){

  var item =
    categories[i];

  if(!item){
    return;
  }


  item.name =
    $("n" + i).value.trim();

  item.slug =
    $("s" + i).value.trim();

  item.description =
    $("d" + i).value;

  item.image =
    $("im" + i).value.trim();

  item.sort_order =
    Number(
      $("o" + i).value
    ) || i + 1;


  if(!item.name){

    showStatus(
      "分类名称不能为空。",
      "err"
    );

    return;

  }


  if(!item.slug){

    showStatus(
      "Slug 不能为空。",
      "err"
    );

    return;

  }


  showStatus(
    "正在保存分类…",
    "wait"
  );


  writeFile(
    "data/categories.json",
    categories,
    catSha,
    "更新分类"
  )

  .then(function(){

    return refreshData();

  })

  .catch(function(error){

    showStatus(
      "保存失败：" +
      error.message,
      "err"
    );

  });

};


/* =========================
   删除分类
========================= */

window.deleteCategory = function(i){

  var item =
    categories[i];

  if(!item){
    return;
  }


  if(
    !confirm(
      "确定删除分类“" +
      item.name +
      "”吗？"
    )
  ){

    return;

  }


  categories.splice(i,1);


  categories.forEach(
    function(c,index){

      c.sort_order =
        index + 1;

    }
  );


  showStatus(
    "正在删除分类…",
    "wait"
  );


  writeFile(
    "data/categories.json",
    categories,
    catSha,
    "删除分类"
  )

  .then(function(){

    return refreshData();

  })

  .catch(function(error){

    showStatus(
      "删除失败：" +
      error.message,
      "err"
    );

  });

};


/* =========================
   刷新数据
========================= */

function refreshData(){

  return Promise.all([

    readFile("data/categories.json"),

    readFile("data/jobs.json")

  ])

  .then(function(result){

    categories =
      Array.isArray(result[0].data)
        ? result[0].data
        : [];

    catSha =
      result[0].sha;


    jobs =
      Array.isArray(result[1].data)
        ? result[1].data
        : [];

    jobSha =
      result[1].sha;


    render();


    showStatus(
      "操作成功，数据已同步",
      "ok"
    );

  });

}


/* =========================
   渲染
========================= */

function render(){

  var cats =
    $("cats");


  if(!categories.length){

    cats.innerHTML =
      '<div class="empty">' +
      '暂无分类，请点击“新增分类”。' +
      '</div>';

  }else{

    cats.innerHTML =
      categories.map(function(c,i){

        return (

          '<div class="item">' +

          '<div class="row">' +

          '<div>' +

          '<label>名称</label>' +

          '<input id="n' + i +
          '" value="' +
          esc(c.name) +
          '">' +

          '<label>Slug</label>' +

          '<input id="s' + i +
          '" value="' +
          esc(c.slug) +
          '">' +

          '<label>描述</label>' +

          '<textarea id="d' + i +
          '">' +
          esc(c.description || "") +
          '</textarea>' +

          '</div>' +

          '<div>' +

          '<label>图片路径</label>' +

          '<input id="im' + i +
          '" value="' +
          esc(c.image || "") +
          '">' +

          '<label>排序</label>' +

          '<input id="o' + i +
          '" type="number" value="' +
          (c.sort_order || i + 1) +
          '">' +

          '</div>' +

          '</div>' +

          '<button type="button" ' +
          'onclick="saveCat(' +
          i +
          ')">' +
          '保存' +
          '</button>' +

          '<button type="button" ' +
          'class="danger" ' +
          'onclick="deleteCategory(' +
          i +
          ')">' +
          '删除' +
          '</button>' +

          '</div>'

        );

      }).join("");

  }


  var jobsEl =
    $("jobs");


  if(!jobs.length){

    jobsEl.innerHTML =
      '<div class="empty">暂无兼职</div>';

  }else{

    jobsEl.innerHTML =
      jobs.map(function(j){

        return (

          '<div class="item">' +

          '<b>' +
          esc(j.title) +
          '</b> ' +

          '<span class="badge">' +
          esc(j.status || "pending") +
          '</span>' +

          '<p>' +
          esc(j.description || "") +
          '</p>' +

          '<div class="muted">' +
          'ID：' +
          esc(j.id || "") +
          '</div>' +

          '</div>'

        );

      }).join("");

  }

}


/* =========================
   页面加载
========================= */

window.addEventListener(
  "load",
  function(){

    restoreLogin();

  }
);


/* =========================
   JS 错误显示
========================= */

window.addEventListener(
  "error",
  function(e){

    console.error(e.error || e.message);

  }
);

})();
</script>

</body>
</html>
