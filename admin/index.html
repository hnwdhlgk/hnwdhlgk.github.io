<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网站管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#183b60;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{width:min(1080px,94%);margin:25px auto}.card{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:20px;margin-bottom:16px}h1{margin-top:0}.muted{color:#71859a;font-size:13px}.ok{color:#137333}.err{color:#b3261e}.wait{color:#8a5a00}.notice{padding:12px;border-radius:9px;background:#f6f8fa;margin-top:10px;white-space:pre-wrap}label{display:block;margin-top:8px}input,textarea{width:100%;padding:11px;border:1px solid #d6e2ed;border-radius:9px;margin:6px 0 12px;font:inherit}textarea{min-height:90px}button{border:0;background:#0d47a1;color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer;margin:3px;font-size:15px}button:hover{filter:brightness(.92)}button:disabled{opacity:.55;cursor:not-allowed}.danger{background:#b3261e}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border-top:1px solid #edf2f6;padding:15px 0}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>网站管理后台</h1>
<div id="login" class="card">
<h2>GitHub 授权</h2>
<p class="muted">纯 GitHub 无服务器后台。Token 只保存在当前浏览器会话。</p>
<label>GitHub 用户名</label><input id="user" value="hnwdhlgk" autocomplete="username">
<label>仓库</label><input id="repo" value="hnwdhlgk.github.io">
<label>Fine-grained Token</label><input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
<button id="connectBtn" type="button" onclick="connectGithub()">连接</button>
<div id="msg" class="notice muted">后台脚本正在加载…</div>
</div>
<div id="app" style="display:none">
<div class="card"><button type="button" onclick="loadAll()">刷新</button><button type="button" class="danger" onclick="logoutGithub()">退出</button><span id="status" class="muted"></span></div>
<div class="card"><h2>8项筛选 / 分类管理</h2><div id="cats"></div><button type="button" onclick="addCategory()">新增分类</button></div>
<div class="card"><h2>兼职发布 / 审核</h2><button type="button" onclick="newJob()">发布兼职</button><div id="jobs"></div></div>
</div>
</div>
<script>
(function(){
var G={user:'',repo:'',token:''},categories=[],jobs=[],catSha='',jobSha='';
function $(id){return document.getElementById(id)}
function msg(t,c){$('msg').innerText=t;$('msg').className='notice '+(c||'muted')}
function stat(t,c){$('status').innerText=t;$('status').className=c||'muted'}
function esc(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
function api(path,method,body){
  var opt={method:method||'GET',headers:{'Authorization':'Bearer '+G.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  return fetch('https://api.github.com'+path,opt).then(function(r){return r.text().then(function(t){var d=null;try{d=t?JSON.parse(t):null}catch(e){}if(!r.ok){var x=(d&&d.message)||('HTTP '+r.status);if(r.status===401)x='401：Token 无效、过期或输入错误。';if(r.status===403)x='403：Token 没有访问仓库内容的权限，请给 Contents Read and write。';if(r.status===404)x='404：仓库不存在或 Token 无权访问。';throw new Error(x)}return d})}).catch(function(e){if(e&&e.message)return Promise.reject(e);return Promise.reject(new Error('无法连接 GitHub API，请检查网络。'))})
}
function readFile(path){return api('/repos/'+encodeURIComponent(G.user)+'/'+encodeURIComponent(G.repo)+'/contents/'+path+'?ref=main').then(function(x){if(!x||!x.content)throw new Error('读取失败：'+path);return{data:JSON.parse(dec(x.content)),sha:x.sha}})}
function writeFile(path,data,sha,message){return api('/repos/'+encodeURIComponent(G.user)+'/'+encodeURIComponent(G.repo)+'/contents/'+path,'PUT',{message:message,content:enc(JSON.stringify(data,null,2)+'\n'),sha:sha,branch:'main'})}
window.connectGithub=function(){
  var b=$('connectBtn'),u=$('user').value.trim(),r=$('repo').value.trim(),t=$('token').value.trim();
  if(!u){msg('请输入 GitHub 用户名。','err');return}
  if(!r){msg('请输入仓库名。','err');return}
  if(!t){msg('请输入 Fine-grained Token。','err');return}
  G={user:u,repo:r,token:t};b.disabled=true;b.innerText='正在连接…';msg('正在连接 GitHub，请稍候…','wait');
  api('/user').then(function(){return api('/repos/'+encodeURIComponent(u)+'/'+encodeURIComponent(r))}).then(function(){return readFile('data/categories.json')}).then(function(c){categories=c.data;catSha=c.sha;return readFile('data/jobs.json')}).then(function(j){jobs=j.data;jobSha=j.sha;try{sessionStorage.setItem('gh_user',u);sessionStorage.setItem('gh_repo',r);sessionStorage.setItem('gh_token',t)}catch(e){}$('login').style.display='none';$('app').style.display='block';stat('连接成功','ok');render()}).catch(function(e){msg('连接失败：\n'+(e.message||e),'err')}).then(function(){b.disabled=false;b.innerText='连接'})
}
window.loadAll=function(){stat('正在同步…','wait');Promise.all([readFile('data/categories.json'),readFile('data/jobs.json')]).then(function(a){categories=a[0].data;catSha=a[0].sha;jobs=a[1].data;jobSha=a[1].sha;render();stat('数据已同步','ok')}).catch(function(e){stat('同步失败：'+e.message,'err')})}
window.logoutGithub=function(){try{sessionStorage.clear()}catch(e){}G={user:'',repo:'',token:''};$('token').value='';$('app').style.display='none';$('login').style.display='block';msg('已退出，请重新输入 Token。')}
window.addCategory=function(){var n=prompt('分类名称');if(!n)return;var s=prompt('Slug','category-'+(categories.length+1));if(!s)return;categories.push({slug:s,name:n,description:'',image:'',enabled:true,sort_order:categories.length+1});writeFile('data/categories.json',categories,catSha,'新增分类').then(loadAll).catch(function(e){stat('新增失败：'+e.message,'err')})}
window.newJob=function(){var title=prompt('标题');if(!title)return;var description=prompt('描述','')||'';jobs.unshift({id:String(Date.now()),title:title,description:description,status:'approved',created_at:new Date().toISOString()});writeFile('data/jobs.json',jobs,jobSha,'发布兼职').then(loadAll).catch(function(e){stat('发布失败：'+e.message,'err')})}
window.render=function(){
 $('cats').innerHTML=categories.map(function(c,i){return '<div class="item"><div class="row"><div><label>名称</label><input id="n'+i+'" value="'+esc(c.name)+'"><label>Slug</label><input id="s'+i+'" value="'+esc(c.slug)+'"><label>描述</label><textarea id="d'+i+'">'+esc(c.description||'')+'</textarea></div><div><label>图片路径</label><input id="im'+i+'" value="'+esc(c.image||'')+'"><label>排序</label><input id="o'+i+'" type="number" value="'+(c.sort_order||i+1)+'"></div></div><button type="button" onclick="saveCat('+i+')">保存</button></div>'}).join('');
 $('jobs').innerHTML=jobs.map(function(j){return '<div class="item"><b>'+esc(j.title)+'</b> <span class="muted">['+esc(j.status||'pending')+']</span><p>'+esc(j.description||'')+'</p></div>'}).join('')||'<p class="muted">暂无兼职</p>'
}
window.saveCat=function(i){var c=categories[i];c.name=$('n'+i).value;c.slug=$('s'+i).value;c.description=$('d'+i).value;c.image=$('im'+i).value;c.sort_order=Number($('o'+i).value)||i+1;writeFile('data/categories.json',categories,catSha,'更新分类').then(loadAll).catch(function(e){stat('保存失败：'+e.message,'err')})}
window.addEventListener('error',function(e){try{msg('页面脚本错误：'+e.message,'err')}catch(x){}})
window.addEventListener('load',function(){msg('后台脚本已加载，请输入 Token 后点击“连接”。','muted')})
})();
</script>
</body>
</html>
