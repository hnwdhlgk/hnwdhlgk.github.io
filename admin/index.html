<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>网站管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#183b60;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{width:min(1080px,94%);margin:25px auto}.card{background:#fff;border:1px solid #e0e8f0;border-radius:16px;padding:20px;margin-bottom:16px}.muted{color:#71859a;font-size:13px}.ok{color:#137333}.err{color:#b3261e}.wait{color:#8a5a00}input,textarea{width:100%;padding:10px;border:1px solid #d6e2ed;border-radius:9px;margin:6px 0 12px;font:inherit}textarea{min-height:90px}button{border:0;background:#0d47a1;color:#fff;padding:10px 15px;border-radius:9px;cursor:pointer;margin:3px}button:disabled{opacity:.55;cursor:not-allowed}.danger{background:#b3261e}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border-top:1px solid #edf2f6;padding:15px 0}.notice{padding:10px 12px;border-radius:9px;background:#f6f8fa;margin-top:10px;white-space:pre-wrap}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>网站管理后台</h1>
<div id="login" class="card">
<h2>GitHub 授权</h2><p class="muted">纯 GitHub 无服务器后台。Fine-grained Token 只保存在当前浏览器会话。</p>
<label>GitHub 用户名</label><input id="user" value="hnwdhlgk" autocomplete="username">
<label>仓库</label><input id="repo" value="hnwdhlgk.github.io">
<label>Fine-grained Token</label><input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
<button id="connectBtn" type="button">连接</button><div id="msg" class="notice muted">请输入 Token 后点击“连接”。</div>
</div>
<div id="app" style="display:none">
<div class="card"><button id="refreshBtn" type="button">刷新</button><button id="logoutBtn" class="danger" type="button">退出</button><span id="status" class="muted"></span></div>
<div class="card"><h2>8项筛选 / 分类管理</h2><div id="cats"></div><button id="addCatBtn" type="button">新增分类</button></div>
<div class="card"><h2>兼职发布 / 审核</h2><button id="newJobBtn" type="button">发布兼职</button><div id="jobs"></div></div>
</div></div>
<script>
(function(){
'use strict';
var G={user:'',repo:'',token:''},categories=[],jobs=[],catSha='',jobSha='';
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function unb64(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
function notice(t,c){$('msg').textContent=t;$('msg').className='notice '+(c||'muted')}
function status(t,c){$('status').textContent=t;$('status').className=c||'muted'}
function saveSession(){try{sessionStorage.setItem('gh_user',G.user);sessionStorage.setItem('gh_repo',G.repo);sessionStorage.setItem('gh_token',G.token)}catch(e){}}
function clearSession(){try{sessionStorage.removeItem('gh_user');sessionStorage.removeItem('gh_repo');sessionStorage.removeItem('gh_token')}catch(e){}}
async function gh(path,opt){
 opt=opt||{};var r;
 try{r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+G.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})},body:opt.body})}
 catch(e){throw new Error('无法连接 GitHub API，请检查网络、代理或浏览器扩展。')}
 var text=await r.text(),data=null;try{data=text?JSON.parse(text):null}catch(e){}
 if(!r.ok){if(r.status===401)throw new Error('Token 无效、已过期，或 Token 类型不正确。');if(r.status===403)throw new Error('GitHub 拒绝访问。请确认 Token 对本仓库拥有 Contents → Read and write 权限。');if(r.status===404)throw new Error('仓库不存在或 Token 无权访问，请检查用户名和仓库名。');throw new Error((data&&data.message)||('GitHub API HTTP '+r.status))}
 return data
}
async function readFile(path){var x=await gh('/repos/'+encodeURIComponent(G.user)+'/'+encodeURIComponent(G.repo)+'/contents/'+path+'?ref=main');if(!x||!x.content)throw new Error('读取失败：'+path);return {data:JSON.parse(unb64(x.content)),sha:x.sha}}
async function saveFile(path,data,sha,message){return gh('/repos/'+encodeURIComponent(G.user)+'/'+encodeURIComponent(G.repo)+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:message,content:b64(JSON.stringify(data,null,2)+'\n'),sha:sha,branch:'main'})})}
async function connect(){
 var btn=$('connectBtn'),user=$('user').value.trim(),repo=$('repo').value.trim(),token=$('token').value.trim();
 if(!user){notice('请输入 GitHub 用户名。','err');$('user').focus();return}if(!repo){notice('请输入仓库名。','err');$('repo').focus();return}if(!token){notice('请输入 Fine-grained Token。','err');$('token').focus();return}
 G={user:user,repo:repo,token:token};btn.disabled=true;btn.textContent='验证中…';notice('正在验证 Token，并检查仓库访问权限…','wait');
 try{await gh('/repos/'+encodeURIComponent(user)+'/'+encodeURIComponent(repo));await readFile('data/categories.json');await readFile('data/jobs.json');saveSession();$('login').style.display='none';$('app').style.display='block';status('连接成功','ok');await loadAll()}
 catch(e){notice('连接失败：\n'+e.message,'err')}
 finally{btn.disabled=false;btn.textContent='连接'}
}
async function loadAll(){status('正在同步…','wait');try{var c=await readFile('data/categories.json'),j=await readFile('data/jobs.json');categories=c.data;catSha=c.sha;jobs=j.data;jobSha=j.sha;render();status('数据已同步','ok')}catch(e){status('同步失败：'+e.message,'err')}}
function render(){
 $('cats').innerHTML=categories.map(function(c,i){return '<div class="item"><div class="row"><div><label>名称</label><input id="n'+i+'" value="'+esc(c.name)+'"><label>Slug</label><input id="s'+i+'" value="'+esc(c.slug)+'"><label>描述</label><textarea id="d'+i+'">'+esc(c.description||'')+'</textarea></div><div><label>图片路径</label><input id="im'+i+'" value="'+esc(c.image||'')+'" placeholder="images/campus.jpg"><label>排序</label><input id="o'+i+'" type="number" value="'+(c.sort_order||i+1)+'"><label><input id="e'+i+'" type="checkbox" '+(c.enabled!==false?'checked':'')+'> 首页显示</label></div></div><button type="button" data-save="'+i+'">保存</button></div>'}).join('');
 $('jobs').innerHTML=jobs.map(function(j,i){return '<div class="item"><b>'+esc(j.title)+'</b> <span class="muted">['+esc(j.status||'pending')+']</span><p>'+esc(j.description||'')+'</p>'+(j.status!=='approved'?'<button type="button" data-approve="'+i+'">审核通过</button>':'')+(j.status!=='rejected'?'<button type="button" class="danger" data-reject="'+i+'">拒绝</button>':'')+'</div>'}).join('')||'<p class="muted">暂无兼职</p>';
 document.querySelectorAll('[data-save]').forEach(function(b){b.addEventListener('click',function(){saveCategory(Number(b.dataset.save))})});document.querySelectorAll('[data-approve]').forEach(function(b){b.addEventListener('click',function(){approve(Number(b.dataset.approve))})});document.querySelectorAll('[data-reject]').forEach(function(b){b.addEventListener('click',function(){reject(Number(b.dataset.reject))})})
}
async function saveCategory(i){var c=categories[i];c.name=$('n'+i).value.trim();c.slug=$('s'+i).value.trim();c.description=$('d'+i).value;c.image=$('im'+i).value.trim();c.sort_order=Number($('o'+i).value)||i+1;c.enabled=$('e'+i).checked;try{status('正在保存分类…','wait');await saveFile('data/categories.json',categories,catSha,'更新分类');await loadAll()}catch(e){status('保存失败：'+e.message,'err')}}
async function addCategory(){var name=prompt('分类名称');if(!name)return;var slug=prompt('Slug','category-'+(categories.length+1));if(!slug)return;categories.push({slug:slug,name:name,description:'',image:'',enabled:true,sort_order:categories.length+1});try{await saveFile('data/categories.json',categories,catSha,'新增分类');await loadAll()}catch(e){status('新增失败：'+e.message,'err')}}
async function approve(i){jobs[i].status='approved';try{await saveFile('data/jobs.json',jobs,jobSha,'审核通过兼职');await loadAll()}catch(e){status('审核失败：'+e.message,'err')}}
async function reject(i){jobs[i].status='rejected';try{await saveFile('data/jobs.json',jobs,jobSha,'拒绝兼职');await loadAll()}catch(e){status('操作失败：'+e.message,'err')}}
async function newJob(){var title=prompt('标题');if(!title)return;var category=prompt('分类 slug','campus')||'campus',description=prompt('描述','')||'',location=prompt('地点','')||'',time=prompt('时间','')||'',contact=prompt('联系方式','')||'';jobs.unshift({id:String(Date.now()),title:title,category:category,description:description,location:location,time:time,contact:contact,status:'approved',created_at:new Date().toISOString()});try{await saveFile('data/jobs.json',jobs,jobSha,'发布兼职');await loadAll()}catch(e){status('发布失败：'+e.message,'err')}}
$('connectBtn').addEventListener('click',connect);$('refreshBtn').addEventListener('click',loadAll);$('addCatBtn').addEventListener('click',addCategory);$('newJobBtn').addEventListener('click',newJob);$('logoutBtn').addEventListener('click',function(){clearSession();G={user:'',repo:'',token:''};$('token').value='';$('app').style.display='none';$('login').style.display='block';notice('已退出，请重新输入 Token。')});
try{var u=sessionStorage.getItem('gh_user'),r=sessionStorage.getItem('gh_repo'),t=sessionStorage.getItem('gh_token');if(u&&r&&t){G={user:u,repo:r,token:t};$('user').value=u;$('repo').value=r;$('token').value=t;$('login').style.display='none';$('app').style.display='block';loadAll()}}catch(e){}
})();
</script>
</body></html>
